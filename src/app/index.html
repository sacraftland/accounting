// ---- color helpers ----
const hex2rgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgb2hex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); };
const lum = h => { const c = hex2rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const safeAccent = (h, bg) => { let c = h; for (let i = 0; i < 12 && contrast(c, bg) < 4.5; i++) c = mix(c, lum(bg) > 0.5 ? '#000000' : '#ffffff', 0.12); return c; };

function applyTheme() {
  const t = uiTheme(), root = document.documentElement, set = (k, v) => root.style.setProperty(k, v);
  const dark = t.mode === 'dark' || (t.mode === 'auto' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'dark' : 'light';
  ['--c-bg', '--c-surface', '--c-surface-2', '--c-border', '--c-border-input', '--c-text', '--c-text-muted', '--c-danger-soft', '--c-success-soft', '--c-warning-soft', '--c-info-soft', '--c-danger', '--c-success', '--c-warning', '--c-info', '--sh-card'].forEach(k => root.style.removeProperty(k));
  if (dark) { [['--c-bg', '#181512'], ['--c-surface', '#221e1a'], ['--c-surface-2', '#2d2823'], ['--c-border', '#3d362f'], ['--c-border-input', '#7d705f'], ['--c-text', '#f1ebe1'], ['--c-text-muted', '#b9ad9c'],
    ['--c-danger', '#f08a7c'], ['--c-success', '#8fd19a'], ['--c-warning', '#f0c46a'], ['--c-info', '#8cc4e6'],
    ['--c-danger-soft', '#3d2420'], ['--c-success-soft', '#21321f'], ['--c-warning-soft', '#3a2f17'], ['--c-info-soft', '#1d2f3a'], ['--sh-card', '0 1px 2px rgba(0,0,0,.4)']].forEach(([k, v]) => set(k, v)); }
  const bg = dark ? '#221e1a' : '#fffdf9', base = hex2rgb(t.accent) ? t.accent : hex2rgb(ORG?.brand_color) ? ORG.brand_color : '#4f6b3a';
  const acc = safeAccent(dark ? mix(base, '#ffffff', 0.25) : base, bg);
  set('--c-accent', acc); set('--c-accent-hover', mix(acc, dark ? '#ffffff' : '#000000', 0.15)); set('--c-accent-soft', mix(acc, bg, dark ? 0.78 : 0.86));
  set('--c-on-accent', contrast(acc, '#ffffff') >= 4.5 ? '#ffffff' : '#1b1711');
  const side = t.sidebar === 'light' ? (dark ? '#221e1a' : '#efe8dc') : t.sidebar === 'accent' ? mix(base, '#000000', 0.45) : (dark ? '#100e0c' : '#2f2a24');
  const sideText = lum(side) > 0.35 ? '#2b241c' : '#f3ece0';
  set('--c-sidebar', side); set('--c-on-sidebar', sideText); set('--c-on-sidebar-muted', mix(sideText, side, 0.35));
  const f = { small: 0.92, normal: 1, large: 1.12, xlarge: 1.25 }[t.size] || 1;
  [['xs', 12, 18], ['sm', 14, 22], ['base', 16, 26], ['lg', 20, 30], ['xl', 28, 38], ['display', 40, 52]].forEach(([k, s, l]) => { set(`--fs-${k}`, Math.round(s * f) + 'px'); set(`--lh-${k}`, Math.round(l * f) + 'px'); });
  const r = { sharp: [2, 4, 6], medium: [6, 10, 16], round: [10, 16, 24] }[t.radius] || [6, 10, 16]; set('--r-sm', r[0] + 'px'); set('--r-md', r[1] + 'px'); set('--r-lg', r[2] + 'px');
  root.dataset.density = t.density;
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', side);
}

// =====================================================================
// Feasibility studies: formula-based (unit margin, break-even, payback,
// cash flow, NPV, IRR, three scenarios). Every input number keeps its
// source — pulled from past projects / products / company overheads,
// typed by hand, or imported from an AI reply the user pasted back.
// Printed report uses the company's invoice design. Inserted after design.js.
// =====================================================================
const FS_KIND = { product: ['منتج أو مشروع جديد', 'b-info'], investment: ['استثمار (مكينة، توسعة…)', 'b-warn'] };
const FS_STATUS = { draft: ['مسودة', 'b-draft'], approved: ['معتمدة', 'b-ok'], rejected: ['مرفوضة', 'b-bad'] };
const FS_SRC = { manual: 'يدوي', history: 'من السجل', ai: 'ذكاء اصطناعي' };
const FS_SCEN = [['real', 'واقعي', 'fs1'], ['pess', 'متشائم', 'fs2'], ['opt', 'متفائل', 'fs3']];
const fsEditable = () => can('feasibility', 'create');
const fsN = (v = 0, src = 'manual', ref) => ({ v, src, ...(ref ? { ref } : {}) });
const fsDefaults = kind => ({
  desc: '', market: '', price_mode: 'mine',
  market_price: fsN(), my_price: fsN(), volume: fsN(1), growth: fsN(0),
  materials: fsN(), labor: fsN(), other_var: fsN(), income: fsN(), opex: fsN(),
  fixed: kind === 'investment' ? [{ name: 'صيانة وتأمين', ...fsN() }] : [{ name: 'إيجار الورشة (حصة المشروع)', ...fsN() }, { name: 'كهرباء وماء', ...fsN() }, { name: 'رواتب إدارية', ...fsN() }, { name: 'تسويق', ...fsN() }],
  capex: kind === 'investment' ? [{ name: 'سعر الأصل / المكينة', ...fsN() }, { name: 'نقل وتركيب وتدريب', ...fsN() }] : [{ name: 'معدات وأدوات', ...fsN() }, { name: 'رأس مال عامل (مواد أول دفعة)', ...fsN() }],
  salvage: fsN(), months: kind === 'investment' ? 60 : 24, discount: 10, zakat: 2.5,
  scen: { real: { price: 0, volume: 0, cost: 0 }, opt: { price: 5, volume: 20, cost: -5 }, pess: { price: -10, volume: -30, cost: 15 } },
});
// merge stored inputs over defaults so older studies always have every key
const fsInputs = s => { const d = fsDefaults(s.kind), i = s.inputs || {}; const o = { ...d, ...i, scen: { ...d.scen, ...(i.scen || {}) } };
  for (const k of Object.keys(d)) if (d[k] && typeof d[k] === 'object' && 'v' in d[k]) o[k] = { ...d[k], ...(i[k] || {}) };
  o.fixed = Array.isArray(i.fixed) ? i.fixed : d.fixed; o.capex = Array.isArray(i.capex) ? i.capex : d.capex; return o; };
const fsNum = x => { if (x == null || x === '') return null; const n = Number(toLatin(String(x)).replace(/[,٬\s]/g, '')); return Number.isFinite(n) ? n : null; };
const fsPct = x => x == null || !Number.isFinite(x) ? '—' : (x * 100).toLocaleString('en-US', { maximumFractionDigits: 1 }) + '٪';
const fsMonths = m => m == null ? 'لا يسترد خلال المدة' : m < 1 ? 'أقل من شهر' : `${m.toLocaleString('en-US', { maximumFractionDigits: 1 })} شهر`;
const fsSum = rows => rows.reduce((s, r) => s + (Number(r.v) || 0), 0);

// ---------- the formulas ----------
function feasCalc(I, kind, sc = { price: 0, volume: 0, cost: 0 }) {
  const fp = 1 + (sc.price || 0) / 100, fv = 1 + (sc.volume || 0) / 100, fc = 1 + (sc.cost || 0) / 100;
  const g = (I.growth.v || 0) / 100, N = Math.max(1, Math.min(120, Math.round(I.months) || 24)), z = Math.max(0, I.zakat || 0) / 100;
  const inv = kind === 'investment';
  const price = (I.price_mode === 'market' ? I.market_price.v : I.my_price.v) * fp, unit = (I.materials.v + I.labor.v + I.other_var.v) * fc, vol = Math.max(0, I.volume.v * fv);
  const fixed = fsSum(I.fixed) * fc, capex = fsSum(I.capex), contribution = inv ? null : price - unit;
  const flows = []; let cum = -capex, payback = null;
  for (let m = 1; m <= N; m++) {
    const gm = Math.pow(1 + g, m - 1), R = inv ? I.income.v * fp * fv * gm : price * vol * gm, V = inv ? I.opex.v * fc : unit * vol * gm;
    const P = R - V - fixed; let net = P > 0 ? P * (1 - z) : P; if (m === N) net += I.salvage.v || 0;
    const prev = cum; cum += net; if (payback == null && cum >= 0 && capex > 0) payback = net > 0 ? m - 1 + (-prev / net) : m;
    flows.push({ m, R, V, F: fixed, net, cum });
  }
  if (capex <= 0 && flows[0]?.net > 0) payback = 0;
  const r = Math.pow(1 + Math.max(0, I.discount || 0) / 100, 1 / 12) - 1;
  const npvAt = x => flows.reduce((s, f) => s + f.net / Math.pow(1 + x, f.m), -capex);
  let irr = null;
  if (capex > 0) { let lo = -0.99, hi = 1, flo = npvAt(lo), fhi = npvAt(hi);
    if (flo * fhi < 0) { for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2, fm = npvAt(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } } irr = Math.pow(1 + (lo + hi) / 2, 12) - 1; } }
  const total = flows.reduce((s, f) => s + f.net, 0), f1 = flows[0];
  return { price, unit, contribution, cm: !inv && price > 0 ? contribution / price : null, vol, fixed, capex, N,
    be: !inv && contribution > 0 ? fixed / contribution : null, beNever: !inv && contribution <= 0,
    m1: f1, margin: f1.R > 0 ? (f1.R - f1.V - f1.F) / f1.R : null, payback, npv: npvAt(r), irr, total, roi: capex > 0 ? (total - capex) / capex : null, flows };
}
const fsVerdict = (real, pess) => real.npv > 0 && real.payback != null ? (pess.npv > 0 ? ['مجدية', 'b-ok', 'مربحة حتى في السيناريو المتشائم.'] : ['مجدية بحذر', 'b-warn', 'مربحة في الواقعي، لكنها تخسر في المتشائم — راجع المخاطر.'])
  : real.npv > 0 ? ['مجدية بحذر', 'b-warn', 'القيمة الحالية موجبة لكن الاسترداد يتجاوز مدة الدراسة.'] : ['غير مجدية بالأرقام الحالية', 'b-bad', 'صافي القيمة الحالية سالب — جرّب سعراً أعلى أو تكلفة أقل.'];
const fsAll = (I, kind) => Object.fromEntries(FS_SCEN.map(([k]) => [k, feasCalc(I, kind, I.scen[k])]));

// cumulative cash for the three scenarios (one axis, thin lines, legend + native tooltip per month)
function fsChart(R) {
  const W = 640, H = 220, pl = 8, pr = 64, pt = 12, pb = 26, N = R.real.flows.length;
  const series = FS_SCEN.map(([k, t, cls]) => ({ t, cls, v: [-R[k].capex, ...R[k].flows.map(f => f.cum)] }));
  const all = series.flatMap(s => s.v), mx = Math.max(1, ...all), mn = Math.min(0, ...all);
  const x = i => W - pr - (W - pl - pr) * (i / N), y = v => pt + (H - pt - pb) * (mx - v) / (mx - mn || 1);
  const ticks = [mn, 0, mx].filter((v, i, a) => a.indexOf(v) === i);
  const step = Math.max(1, Math.ceil(N / 8));
  return `<div class="fs-legend" aria-hidden="true">${series.map(s => `<span><i class="${s.cls}"></i>${s.t}</span>`).join('')}</div>
  <svg viewBox="0 0 ${W} ${H}" class="chart fs-chart" role="img" aria-label="النقد التراكمي حسب الشهر لثلاثة سيناريوهات">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="${t === 0 ? 'zero' : 'grid'}"/><text x="${W - pr + 6}" y="${y(t) + 4}" class="tick">${Math.round(t / 100).toLocaleString('en-US')}</text>`).join('')}
    ${series.map(s => `<polyline class="${s.cls}" fill="none" points="${s.v.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`).join('')}
    ${Array.from({ length: N + 1 }, (_, i) => `<rect class="hit" x="${(x(i) - (W - pl - pr) / N / 2).toFixed(1)}" y="${pt}" width="${((W - pl - pr) / N).toFixed(1)}" height="${H - pt - pb}"><title>${i === 0 ? 'البداية' : 'الشهر ' + i}: ${series.map(s => `${s.t} ${money(s.v[i])}`).join(' · ')}</title></rect>`).join('')}
    ${Array.from({ length: N + 1 }, (_, i) => i).filter(i => i % step === 0).map(i => `<text x="${x(i)}" y="${H - 8}" class="tick" text-anchor="middle">${i}</text>`).join('')}
  </svg><p class="xs muted" style="margin:2px 0 0">النقد التراكمي بالريال — المحور الأفقي بالأشهر. حيث يعبر الخط الصفر يكون الاسترداد.</p>`;
}

// history → inputs (per unit)
function fsApplyProject(I, h, keys) {
  const q = h.qty > 0 ? h.qty : 1, ref = `${h.name}${q > 1 ? ` ÷ ${fq(q)} وحدة` : ''}`;
  const val = { my_price: h.revenue / q, materials: h.materials / q, labor: h.labor / q, other_var: h.other / q };
  keys.forEach(k => { if (val[k] != null && (k !== 'my_price' || h.revenue > 0)) I[k] = fsN(Math.round(val[k]), 'history', ref); });
}
function fsApplyItem(I, h, keys) {
  const val = { my_price: h.avg_price ?? h.list_price, materials: h.avg_cost, volume: h.sold_qty > 0 ? Math.round(h.sold_qty / 12 * 100) / 100 : null };
  const why = { my_price: h.avg_price != null ? 'متوسط سعر البيع آخر 12 شهر' : 'سعر البيع في بطاقة المنتج', materials: 'متوسط التكلفة في المخزون', volume: 'متوسط المبيع الشهري آخر 12 شهر' };
  keys.forEach(k => { if (val[k] != null && val[k] > 0) I[k] = fsN(k === 'volume' ? val[k] : Math.round(val[k]), 'history', `${h.name} — ${why[k]}`); });
}

// Full backup & restore, export of every table to Excel, and the files for
// the dedicated Linux backup computer. Also a tiny .xlsx writer used by the
// report builder. Inserted after feasibility.js.

const BACKUP_PY = "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\u0643\u0631\u0627\u0641\u062a \u0644\u0627\u0646\u062f \u2014 \u0627\u0644\u0646\u0633\u062e \u0627\u0644\u0627\u062d\u062a\u064a\u0627\u0637\u064a \u0627\u0644\u062a\u0644\u0642\u0627\u0626\u064a \u0639\u0644\u0649 \u0643\u0645\u0628\u064a\u0648\u062a\u0631 \u0644\u064a\u0646\u0643\u0633 \u0645\u062e\u0635\u0635.\n\n\u064a\u0633\u062d\u0628 \u0646\u0633\u062e\u0629 \u0643\u0627\u0645\u0644\u0629 \u0645\u0646 \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0634\u0631\u0643\u0629 \u0643\u0644 \u0644\u064a\u0644\u0629 \u0648\u064a\u062d\u0641\u0638\u0647\u0627 \u0645\u0636\u063a\u0648\u0637\u0629 \u0641\u064a \u0645\u062c\u0644\u062f \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0643\u0645\u0628\u064a\u0648\u062a\u0631\u060c\n\u0648\u064a\u062d\u062a\u0641\u0638 \u0628\u0622\u062e\u0631 30 \u0646\u0633\u062e\u0629 \u064a\u0648\u0645\u064a\u0629 + \u0646\u0633\u062e\u0629 \u0644\u0643\u0644 \u0634\u0647\u0631 \u0644\u0645\u062f\u0629 12 \u0634\u0647\u0631\u0627\u064b\u060c \u0648\u064a\u062a\u062d\u0642\u0642 \u0645\u0646 \u0633\u0644\u0627\u0645\u0629 \u0643\u0644 \u0645\u0644\u0641.\n\u0644\u0627 \u064a\u062d\u062a\u0627\u062c \u0623\u064a \u0645\u0643\u062a\u0628\u0629 \u0625\u0636\u0627\u0641\u064a\u0629: Python 3.8+ \u0641\u0642\u0637.\n\n\u0627\u0644\u0623\u0648\u0627\u0645\u0631:\n  python3 craftland-backup.py setup      \u0625\u0639\u062f\u0627\u062f \u0623\u0648\u0644 \u0645\u0631\u0629 (\u0627\u0644\u0628\u0631\u064a\u062f \u0648\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u0648\u0645\u062c\u0644\u062f \u0627\u0644\u062d\u0641\u0638)\n  python3 craftland-backup.py run        \u0646\u0633\u062e\u0629 \u0627\u0644\u0622\u0646\n  python3 craftland-backup.py install    \u062a\u0634\u063a\u064a\u0644 \u062a\u0644\u0642\u0627\u0626\u064a \u0643\u0644 \u0644\u064a\u0644\u0629 (systemd)\n  python3 craftland-backup.py status     \u0622\u062e\u0631 \u0627\u0644\u0646\u0633\u062e \u0648\u0645\u0648\u0639\u062f \u0627\u0644\u0642\u0627\u062f\u0645\u0629\n  python3 craftland-backup.py verify [\u0645\u0644\u0641]   \u0627\u0644\u062a\u062d\u0642\u0642 \u0645\u0646 \u0633\u0644\u0627\u0645\u0629 \u0646\u0633\u062e\u0629\n  python3 craftland-backup.py uninstall  \u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u062a\u0634\u063a\u064a\u0644 \u0627\u0644\u062a\u0644\u0642\u0627\u0626\u064a\n\"\"\"\nimport argparse, datetime, getpass, gzip, hashlib, json, os, pathlib, shutil, subprocess, sys, time, urllib.error, urllib.request\n\nURL = '__URL__'.rstrip('/')\nKEY = '__KEY__'          # publishable key (public by design) \u2014 never put a secret / service key here\nORG = '__ORG__'\nCOMPANY = '__NAME__'\n\nHOME = pathlib.Path.home()\nCFG_DIR = pathlib.Path(os.environ.get('CRAFTLAND_BACKUP_CONFIG', HOME / '.config' / 'craftland-backup'))\nCRED, CONF = CFG_DIR / 'credentials.json', CFG_DIR / 'config.json'\nDEFAULTS = {'dir': str(HOME / 'craftland-backups'), 'keep_daily': 30, 'keep_monthly': 12, 'mirror_dir': ''}\nPREFIX = 'craftland-'\n\n\ndef conf():\n    c = dict(DEFAULTS)\n    if CONF.exists(): c.update(json.loads(CONF.read_text(encoding='utf-8')))\n    return c\n\n\ndef log(msg, c=None):\n    line = f\"{datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}  {msg}\"\n    print(line, flush=True)\n    try:\n        d = pathlib.Path((c or conf())['dir']); d.mkdir(parents=True, exist_ok=True)\n        with open(d / 'backup.log', 'a', encoding='utf-8') as f: f.write(line + '\\n')\n    except OSError: pass\n\n\ndef http(method, path, body=None, token=None, timeout=300):\n    data = None if body is None else json.dumps(body).encode()\n    r = urllib.request.Request(URL + path, data=data, method=method, headers={\n        'apikey': KEY, 'Authorization': 'Bearer ' + (token or KEY), 'Content-Type': 'application/json', 'Accept': 'application/json'})\n    try:\n        with urllib.request.urlopen(r, timeout=timeout) as res: return res.read()\n    except urllib.error.HTTPError as e:\n        detail = e.read().decode('utf-8', 'replace')[:300]\n        raise RuntimeError(f'\u0627\u0644\u062e\u0627\u062f\u0645 \u0631\u062f \u0628\u062e\u0637\u0623 {e.code}: {detail}') from None\n    except urllib.error.URLError as e:\n        raise RuntimeError(f'\u062a\u0639\u0630\u0631 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u062e\u0627\u062f\u0645: {e.reason}') from None\n\n\ndef login():\n    if not CRED.exists(): raise RuntimeError('\u0644\u0645 \u064a\u062a\u0645 \u0627\u0644\u0625\u0639\u062f\u0627\u062f \u0628\u0639\u062f \u2014 \u0634\u063a\u0651\u0644: python3 craftland-backup.py setup')\n    cr = json.loads(CRED.read_text(encoding='utf-8'))\n    tok = json.loads(http('POST', '/auth/v1/token?grant_type=password', {'email': cr['email'], 'password': cr['password']}, timeout=60))\n    if not tok.get('access_token'): raise RuntimeError('\u0641\u0634\u0644 \u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644 \u2014 \u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0628\u0631\u064a\u062f \u0648\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 (\u0634\u063a\u0651\u0644 setup \u0645\u0646 \u062c\u062f\u064a\u062f)')\n    return tok['access_token']\n\n\ndef check_backup(raw):\n    b = json.loads(raw)\n    if b.get('format') != 'craftland-backup' or b.get('version') != 1: raise RuntimeError('\u0627\u0644\u0645\u0644\u0641 \u0627\u0644\u0645\u0633\u062a\u0644\u0645 \u0644\u064a\u0633 \u0646\u0633\u062e\u0629 \u0627\u062d\u062a\u064a\u0627\u0637\u064a\u0629 \u0635\u0627\u0644\u062d\u0629')\n    if b.get('org_id') != ORG: raise RuntimeError('\u0627\u0644\u0646\u0633\u062e\u0629 \u0644\u0634\u0631\u0643\u0629 \u0623\u062e\u0631\u0649')\n    t = b.get('tables') or {}\n    if 'accounts' not in t or not t['accounts']: raise RuntimeError('\u0627\u0644\u0646\u0633\u062e\u0629 \u0646\u0627\u0642\u0635\u0629: \u0644\u0627 \u062a\u0648\u062c\u062f \u0634\u062c\u0631\u0629 \u062d\u0633\u0627\u0628\u0627\u062a')\n    return b, sum(len(v) for v in t.values()), len(t)\n\n\ndef sha256(p):\n    h = hashlib.sha256()\n    with open(p, 'rb') as f:\n        for chunk in iter(lambda: f.read(1 << 20), b''): h.update(chunk)\n    return h.hexdigest()\n\n\ndef rotate(d, keep_daily, keep_monthly):\n    files = sorted(d.glob(PREFIX + '*.json.gz'), reverse=True)          # newest first (names sort by date)\n    month = lambda f: f.name[len(PREFIX):len(PREFIX) + 7]                # YYYY-MM\n    keep, have, months = set(files[:keep_daily]), {month(f) for f in files[:keep_daily]}, {}\n    for f in files[keep_daily:]:                                         # then one per older month\n        m = month(f)\n        if m not in have and m not in months and len(months) < keep_monthly: months[m] = f\n    keep |= set(months.values())\n    for f in files:\n        if f not in keep:\n            f.unlink(missing_ok=True); pathlib.Path(str(f) + '.sha256').unlink(missing_ok=True)\n\n\ndef run():\n    c = conf(); d = pathlib.Path(c['dir']); d.mkdir(parents=True, exist_ok=True)\n    last = None\n    for attempt in range(1, 4):\n        try:\n            token = login()\n            raw = http('POST', '/rest/v1/rpc/export_org', {'p_org': ORG, 'p_source': 'script'}, token)\n            b, rows, tables = check_backup(raw)\n            name = f\"{PREFIX}{datetime.datetime.now().strftime('%Y-%m-%d_%H%M')}.json.gz\"\n            tmp = d / (name + '.part')\n            with gzip.open(tmp, 'wb', compresslevel=6) as f: f.write(raw)\n            with gzip.open(tmp, 'rb') as f: check_backup(f.read())          # read it back before trusting it\n            final = d / name; os.replace(tmp, final)\n            digest = sha256(final); pathlib.Path(str(final) + '.sha256').write_text(f'{digest}  {name}\\n', encoding='utf-8')\n            if c.get('mirror_dir'):\n                m = pathlib.Path(c['mirror_dir'])\n                if m.is_dir():\n                    shutil.copy2(final, m / name); shutil.copy2(str(final) + '.sha256', m / (name + '.sha256')); rotate(m, c['keep_daily'], c['keep_monthly'])\n                else: log(f'\u062a\u0646\u0628\u064a\u0647: \u0645\u062c\u0644\u062f \u0627\u0644\u0646\u0633\u062e\u0629 \u0627\u0644\u062b\u0627\u0646\u064a\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d ({m}) \u2014 \u062d\u064f\u0641\u0638\u062a \u0627\u0644\u0646\u0633\u062e\u0629 \u0627\u0644\u0623\u0633\u0627\u0633\u064a\u0629 \u0641\u0642\u0637', c)\n            rotate(d, c['keep_daily'], c['keep_monthly'])\n            (d / 'last_ok.json').write_text(json.dumps({'at': datetime.datetime.now().isoformat(timespec='seconds'), 'file': name, 'rows': rows, 'tables': tables, 'sha256': digest}, ensure_ascii=False), encoding='utf-8')\n            log(f'\u2713 \u0646\u0633\u062e\u0629 \u0646\u0627\u062c\u062d\u0629: {name} \u2014 {tables} \u062c\u062f\u0648\u0644\u060c {rows:,} \u0633\u062c\u0644\u060c {final.stat().st_size / 1024:,.0f} \u0643\u064a\u0644\u0648\u0628\u0627\u064a\u062a', c)\n            return 0\n        except Exception as e:   # noqa: BLE001 \u2014 keep trying, then report\n            last = e; log(f'\u2717 \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629 {attempt}: {e}', c)\n            for p in d.glob('*.part'): p.unlink(missing_ok=True)\n            if attempt < 3: time.sleep(float(os.environ.get('CRAFTLAND_BACKUP_RETRY_WAIT', 30)) * attempt)\n    log(f'\u2717 \u0641\u0634\u0644 \u0627\u0644\u0646\u0633\u062e \u0627\u0644\u0627\u062d\u062a\u064a\u0627\u0637\u064a: {last}', c)\n    return 1\n\n\ndef setup():\n    print(f'\u0625\u0639\u062f\u0627\u062f \u0627\u0644\u0646\u0633\u062e \u0627\u0644\u0627\u062d\u062a\u064a\u0627\u0637\u064a \u0644\u0640 \u00ab{COMPANY}\u00bb\\n')\n    print('\u0627\u0633\u062a\u062e\u062f\u0645 \u062d\u0633\u0627\u0628 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0627\u0644\u0645\u062e\u0635\u0635 \u0644\u0644\u0646\u0633\u062e (\u0635\u0644\u0627\u062d\u064a\u0629 \u00ab\u0627\u0644\u0646\u0633\u062e \u0627\u0644\u0627\u062d\u062a\u064a\u0627\u0637\u064a \u2014 \u0639\u0631\u0636\u00bb \u0641\u0642\u0637)\u060c \u0648\u0644\u064a\u0633 \u062d\u0633\u0627\u0628 \u0627\u0644\u0645\u0627\u0644\u0643.\\n')\n    email = input('\u0627\u0644\u0628\u0631\u064a\u062f \u0627\u0644\u0625\u0644\u0643\u062a\u0631\u0648\u0646\u064a \u0644\u062d\u0633\u0627\u0628 \u0627\u0644\u0646\u0633\u062e: ').strip()\n    while True:\n        pw = getpass.getpass('\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 (\u0644\u0627 \u062a\u0638\u0647\u0631 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0643\u062a\u0627\u0628\u0629): ')\n        if pw and pw == getpass.getpass('\u0623\u0639\u062f \u0643\u062a\u0627\u0628\u0629 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631: '): break\n        print('\u063a\u064a\u0631 \u0645\u062a\u0637\u0627\u0628\u0642\u0629\u060c \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649.')\n    c = conf()\n    c['dir'] = input(f\"\u0645\u062c\u0644\u062f \u062d\u0641\u0638 \u0627\u0644\u0646\u0633\u062e [{c['dir']}]: \").strip() or c['dir']\n    c['mirror_dir'] = input('\u0645\u062c\u0644\u062f \u0646\u0633\u062e\u0629 \u062b\u0627\u0646\u064a\u0629\u060c \u0645\u062b\u0644 \u0642\u0631\u0635 \u062e\u0627\u0631\u062c\u064a (\u0627\u062e\u062a\u064a\u0627\u0631\u064a\u060c Enter \u0644\u0644\u062a\u062e\u0637\u064a): ').strip() or c.get('mirror_dir', '')\n    CFG_DIR.mkdir(parents=True, exist_ok=True); os.chmod(CFG_DIR, 0o700)\n    fd = os.open(CRED, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)\n    with os.fdopen(fd, 'w', encoding='utf-8') as f: json.dump({'email': email, 'password': pw}, f)\n    CONF.write_text(json.dumps(c, ensure_ascii=False, indent=2), encoding='utf-8')\n    print('\\n\u0623\u062c\u0631\u0651\u0628 \u0627\u0644\u062f\u062e\u0648\u0644 \u0648\u0646\u0633\u062e\u0629 \u0623\u0648\u0644\u0649\u2026')\n    code = run()\n    print('\\n\u062a\u0645 \u0627\u0644\u0625\u0639\u062f\u0627\u062f \u2713 \u2014 \u0627\u0644\u062e\u0637\u0648\u0629 \u0627\u0644\u062a\u0627\u0644\u064a\u0629: python3 craftland-backup.py install' if code == 0 else '\\n\u0627\u0644\u0625\u0639\u062f\u0627\u062f \u062d\u064f\u0641\u0638\u060c \u0644\u0643\u0646 \u0627\u0644\u0646\u0633\u062e\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u0641\u0634\u0644\u062a \u2014 \u0631\u0627\u062c\u0639 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0623\u0639\u0644\u0627\u0647.')\n    return code\n\n\nUNIT = HOME / '.config' / 'systemd' / 'user'\n\n\ndef install():\n    UNIT.mkdir(parents=True, exist_ok=True)\n    me = pathlib.Path(__file__).resolve()\n    (UNIT / 'craftland-backup.service').write_text(f\"\"\"[Unit]\nDescription=Craft Land backup\nWants=network-online.target\nAfter=network-online.target\n\n[Service]\nType=oneshot\nExecStart={sys.executable} {me} run\nNice=10\n\"\"\", encoding='utf-8')\n    (UNIT / 'craftland-backup.timer').write_text(\"\"\"[Unit]\nDescription=Craft Land nightly backup\n\n[Timer]\nOnCalendar=*-*-* 02:30\nRandomizedDelaySec=15m\nPersistent=true\n\n[Install]\nWantedBy=timers.target\n\"\"\", encoding='utf-8')\n    ok = True\n    for cmd in (['systemctl', '--user', 'daemon-reload'], ['systemctl', '--user', 'enable', '--now', 'craftland-backup.timer']):\n        r = subprocess.run(cmd, capture_output=True, text=True)\n        if r.returncode: ok = False; print('\u062a\u0639\u0630\u0631:', ' '.join(cmd), r.stderr.strip())\n    r = subprocess.run(['loginctl', 'enable-linger', getpass.getuser()], capture_output=True, text=True)\n    if r.returncode: print(f'\u0644\u062a\u0639\u0645\u0644 \u0627\u0644\u0646\u0633\u062e \u062d\u062a\u0649 \u0628\u062f\u0648\u0646 \u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644\u060c \u0646\u0641\u0651\u0630 \u0645\u0631\u0629 \u0648\u0627\u062d\u062f\u0629: sudo loginctl enable-linger {getpass.getuser()}')\n    if ok: print('\u2713 \u0627\u0644\u0646\u0633\u062e \u0627\u0644\u062a\u0644\u0642\u0627\u0626\u064a \u0645\u0641\u0639\u0651\u0644: \u0643\u0644 \u0644         <button type="button" class="btn ghost sm" id="rbfadd" style="justify-self:start">${icon('plus')}إضافة فلتر</button></div></fieldset>
      <div class="form-grid"><div class="field"><label for="rbsort">الترتيب حسب</label><select class="input" id="rbsort">${opts([...(d.group.length ? [...d.group.map(g => [g, F()[g][1]]), ...d.measures.map(m => [rbMKey(m), rbMLabel(m, F())])] : d.columns.map(c => [c, F()[c][1]]))], d.sort?.f || '', 'تلقائي')}</select></div>
        <div class="field"><label for="rbdir">الاتجاه</label><select class="input" id="rbdir">${opts([['desc', 'من الأعلى'], ['asc', 'من الأقل']], d.sort?.dir || 'desc')}</select></div></div>
      ${field('rblim', 'أعلى عدد صفوف (0 = الكل)', { value: d.limit || 0, attrs: 'inputmode="numeric"' })}
      <datalist id="rbdl-x"></datalist>${[...new Set(d.filters.map(x => x.f))].map(k => `<datalist id="rbdl-${esc(k)}">${[...new Set(rows.map(r => r[k]).filter(v => v != null && v !== ''))].slice(0, 200).map(v => `<option value="${esc(v)}">`).join('')}</datalist>`).join('')}`;
  };
  const drawOut = () => {
    const [from, to] = rbPeriod(d);
    if (!res) { $('#rbout').innerHTML = loading(); return; }
    $('#rbout').innerHTML = `<div class="rep-head"><b style="font-size:16px">${esc(ORG.name_ar)}</b><h2 style="margin:4px 0">${esc(d.name || RB_DS[d.ds].t)}</h2>
      <p class="muted" style="margin:0 0 8px">${RB_DS[d.ds].snap ? `كما في <span class="num">${to}</span>` : `من <span class="num">${from}</span> إلى <span class="num">${to}</span>`} · ${res.n.toLocaleString('en-US')} سجل${d.filters.length ? ` بعد ${d.filters.length} فلتر` : ''}${res.rows.length !== res.n ? ` · ${res.rows.length.toLocaleString('en-US')} صف` : ''}</p></div>
      ${res.rows.length ? `${d.group.length ? rbChart(res) : ''}<div class="tbl-wrap"><table class="list-tbl rep-tbl" id="rbtbl"><thead><tr>${res.cols.map((c, i) => `<th class="${RB_NUM.includes(c.type) ? 'amt' : ''}"><button type="button" class="rb-sort" data-sort="${esc(c.k)}">${esc(c.label)}${d.sort && (d.sort.f === c.k) ? (d.sort.dir === 'asc' ? ' ▲' : ' ▼') : ''}</button></th>`).join('')}</tr></thead>
        <tbody>${res.rows.slice(0, 2000).map(r => `<tr>${r.map((v, i) => { const t = res.cols[i].type, n = RB_NUM.includes(t); return `<td class="${n ? 'amt num' : ''} ${n && v < 0 ? 'down' : ''}">${esc(rbFmt(v, t))}</td>`; }).join('')}</tr>`).join('')}</tbody>
        ${res.total.some(x => x != null) ? `<tfoot><tr>${res.total.map((v, i) => `<td class="${v != null ? 'amt num' : ''}"><b>${i === 0 ? 'الإجمالي' : v != null ? esc(rbFmt(v, res.cols[i].type)) : ''}</b></td>`).join('')}</tr></tfoot>` : ''}</table></div>
        ${res.rows.length > 2000 ? `<p class="help">يُعرض أول 2,000 صف — التصدير إلى Excel يشمل الكل.</p>` : ''}` : empty('chart', 'لا توجد بيانات', 'غيّر الفترة أو الفلاتر.')}`;
    $$('#rbout [data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort, fk = k.includes(':') && !k.startsWith('pv:') ? k : k; d.sort = { f: fk, dir: d.sort?.f === fk && d.sort.dir === 'desc' ? 'asc' : 'desc' }; compute(); drawCfg(); });
  };
  const compute = () => { res = rbCompute(d, rows); drawOut(); };
  const load = async () => { const [from, to] = rbPeriod(d), key = `${ORG.id}|${d.ds}|${from}|${to}`; res = null; drawOut();
    try { rows = RB_CACHE.get(key) || await api.dataset(d.ds, from, to); RB_CACHE.set(key, rows); if (RB_CACHE.size > 12) RB_CACHE.delete(RB_CACHE.keys().next().value); compute(); }
    catch (e) { $('#rbout').innerHTML = `<p class="help err">${esc(e.message)}</p>`; } };

  $('#main').innerHTML = `<a class="crumb no-print" href="#/report-builder">${icon('chev')} منشئ التقارير</a>
    <div class="page-head no-print"><h1>${rec ? esc(rec.name) : 'تقرير جديد'}</h1><div class="row" style="gap:8px;flex-wrap:wrap">
      ${ed ? `<button class="btn primary" id="rbsave">حفظ</button>${rec ? `<button class="btn secondary" id="rbsaveas">حفظ كنسخة</button><label class="row" style="gap:6px"><input type="checkbox" id="rbpin" ${rec.pinned ? 'checked' : ''}> مثبّت</label>` : ''}` : ''}
      <button class="btn secondary" id="rbxl">${icon('down')}Excel</button><button class="btn secondary" id="rbcsv">CSV</button><button class="btn secondary" onclick="window.print()">${icon('down')}طباعة / PDF</button>
      ${ed ? `<button class="btn ghost" id="rbai">اطلب من الذكاء الاصطناعي</button><button class="btn ghost" id="rbaiin">لصق تعريف</button>` : ''}${rec && ed ? `<button class="btn ghost" id="rbdel">${icon('trash')}حذف</button>` : ''}</div></div>
    <div class="rb-grid"><form class="card grid no-print" id="rbcfg" style="gap:12px" novalidate onsubmit="return false"></form><section class="card" id="rbout"></section></div>`;
  drawCfg(); load();

  const cfg = $('#rbcfg');
  const reset = ds => { const n = d.name; d = rbClean({ ...rbDef(ds), name: n, period: d.period, from: d.from, to: d.to }); };
  cfg.addEventListener('change', e => { const t = e.target; let reload = false;
    if (t.dataset.fv != null || t.id === 'f-rbname') { if (t.id === 'f-rbname') d.name = t.value.trim(); return; }
    if (t.id === 'rbds') { reset(t.value); reload = true; }
    else if (t.id === 'rbper') { d.period = t.value; if (t.value === 'custom') { const [a, b] = rbPeriod({ ...d, period: 'this-month' }); d.from ||= a; d.to ||= b; } reload = true; }
    else if (t.id === 'f-rbfrom') { d.from = t.value; reload = true; } else if (t.id === 'f-rbto') { d.to = t.value; reload = true; }
    else if (t.id === 'rbg0' || t.id === 'rbg1') { d.group = [$('#rbg0').value, t.id === 'rbg0' && !t.value ? '' : $('#rbg1').value].filter(Boolean); d = rbClean(d); }
    else if (t.dataset.ma != null) { d.measures[+t.dataset.ma].agg = t.value; d = rbClean(d); } else if (t.dataset.mf != null) { d.measures[+t.dataset.mf].f = t.value; if (t.value === '*') d.measures[+t.dataset.mf].agg = 'count'; else if (d.measures[+t.dataset.mf].agg === 'count') d.measures[+t.dataset.mf].agg = 'sum'; d = rbClean(d); }
    else if (t.id === 'rbpv') d.pivot = t.value;
    else if (t.dataset.col) d.columns = RB_DS[d.ds].f.map(x => x[0]).filter(k => k === t.dataset.col ? t.checked : d.columns.includes(k));
    else if (t.dataset.ff != null) { d.filters[+t.dataset.ff] = { f: t.value, op: RB_NUM.includes(F()[t.value][2]) ? 'gt' : 'eq', v: '' }; }
    else if (t.dataset.fo != null) d.filters[+t.dataset.fo].op = t.value;
    else if (t.id === 'rbsort' || t.id === 'rbdir') d.sort = $('#rbsort').value ? { f: $('#rbsort').value, dir: $('#rbdir').value } : null;
    else if (t.id === 'f-rblim') d.limit = Math.max(0, parseInt(toLatin(t.value)) || 0);
    else if (t.id === 'f-rbname') { d.name = t.value.trim(); }
    if (!d.columns.length) d.columns = [RB_DS[d.ds].f[0][0]];
    drawCfg(); reload ? load() : compute(); });
  cfg.addEventListener('input', e => { const t = e.target;
    if (t.dataset.fv != null) { d.filters[+t.dataset.fv].v = t.value; clearTimeout(cfg._t); cfg._t = setTimeout(compute, 250); }
    if (t.id === 'f-rbname') { d.name = t.value.trim(); } });
  cfg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'rbmadd') d.measures.push({ f: '*', agg: 'count' }); else if (b.dataset.mdel != null) { d.measures.splice(+b.dataset.mdel, 1); d = rbClean(d); }
    else if (b.id === 'rbfadd') { const f0 = RB_DS[d.ds].f.find(x => x[2] === 'text') || RB_DS[d.ds].f[0]; d.filters.push({ f: f0[0], op: 'eq', v: '' }); }
    else if (b.dataset.fdel != null) d.filters.splice(+b.dataset.fdel, 1); else return;
    drawCfg(); compute(); });

  const def = () => { const { name, ...rest } = d; return rest; };
  const save = async asNew => { const name = (d.name || '').trim(); if (!name) { $('#f-rbname')?.focus(); return toast('اكتب اسم التقرير أولاً', 'warn'); }
    try { const row = await api.saveReport({ id: asNew ? null : rec?.id, name, definition: def(), pinned: asNew ? false : !!$('#rbpin')?.checked }); toast('حُفظ التقرير'); if (!rec || asNew) location.hash = '#/report-builder/' + row.id; else rec = row; } catch (x) { fail(x); } };
  if ($('#rbsave')) $('#rbsave').onclick = () => save(false);
  if ($('#rbsaveas')) $('#rbsaveas').onclick = () => { d.name = (d.name || '') + ' (نسخة)'; save(true); };
  if ($('#rbpin')) $('#rbpin').onchange = () => save(false);
  if ($('#rbdel')) $('#rbdel').onclick = () => drawer('حذف التقرير', `<p>حذف «${esc(rec.name)}»؟ البيانات نفسها لا تتأثر.</p>`, async () => { await api.deleteReport(rec.id); toast('حُذف'); location.hash = '#/report-builder'; }, 'حذف');
  const title = () => (d.name || RB_DS[d.ds].t) + ' ' + rbPeriod(d).join('_');
  $('#rbcsv').onclick = () => { const t = $('#rbtbl'); t ? tableToCsv(t, title()) : toast('لا توجد بيانات', 'warn'); };
  $('#rbxl').onclick = () => { if (!res?.rows.length) return toast('لا توجد بيانات', 'warn');
    const conv = (v, t) => v == null ? '' : t === 'money' ? Math.round(Number(v)) / 100 : RB_NUM.includes(t) ? Number(v) : t === 'month' ? monthName(v + '-01') : v;
    const sheet = [res.cols.map(c => c.label + (c.type === 'money' ? ' (ر.س)' : '')), ...res.rows.map(r => r.map((v, i) => conv(v, res.cols[i].type)))];
    if (res.total.some(x => x != null)) sheet.push(res.total.map((v, i) => i === 0 ? 'الإجمالي' : v == null ? '' : conv(v, res.cols[i].type)));
    dlBlob(xlsxBlob([{ name: (d.name || RB_DS[d.ds].t).slice(0, 31), rows: sheet }]), title().replace(/[\\/:*?"<>|]/g, '') + '.xlsx'); };

  // AI: the prompt carries the catalogue and the format; the reply is a definition we validate
  if ($('#rbai')) $('#rbai').onclick = () => {
    const cat = Object.entries(RB_DS).filter(([k]) => rbOk(k)).map(([k, v]) => `- ${k} (${v.t}): ${v.f.map(f => `${f[0]}=${f[1]}[${f[2]}]`).join('، ')}`).join('\n');
    const form = drawer('اطلب تقريراً من الذكاء الاصطناعي', `<p class="help" style="margin:0">اكتب التقرير اللي تبيه بكلامك، انسخ النص لبرنامج الذكاء الاصطناعي من حسابك، ثم الصق رده عبر «لصق تعريف». ما يُرسل أي بيانات من شركتك — فقط أسماء الحقول.</p>
      <div class="field"><label for="rbq">وش التقرير اللي تبيه؟</label><textarea class="input" id="rbq" rows="3" style="height:auto;padding:8px 12px" placeholder="مثل: أبي ربح كل صنف هذه السنة مرتب من الأعلى، بس للمنتجات"></textarea></div>
      <div class="field"><label for="rbqp">النص الجاهز</label><textarea class="input" id="rbqp" rows="8" readonly style="height:auto;padding:8px 12px;font-size:12px"></textarea></div>`, async () => {
      const t = $('#rbqp', form).value; try { await navigator.clipboard.writeText(t); } catch { $('#rbqp', form).select(); document.execCommand?.('copy'); } toast('نُسخ النص — الصقه في برنامج الذكاء الاصطناعي'); }, 'نسخ النص');
    const gen = () => { $('#rbqp', form).value = `أنت مساعد يكتب تعريفات تقارير لنظام محاسبي. الطلب: ${$('#rbq', form).value.trim() || '(اكتب الطلب)'}\n\nمصادر البيانات المتاحة وحقولها (المفتاح=الاسم[النوع]):\n${cat}\n\n` +
      `القواعد: الأنواع money بالهللة لكن قيم الفلاتر تُكتب بالريال. العمليات: ${Object.keys(RB_AGG).join(', ')}. شروط الفلاتر: ${Object.keys(RB_OPS).join(', ')}. الفترات: ${periodPresets().map(p => p[0]).join(', ')} أو custom مع from و to بصيغة YYYY-MM-DD. group حتى حقلين، وpivot حقل نصي أو month لتوزيع القيمة الأولى على أعمدة.\n\n` +
      'أرجع كتلة JSON واحدة فقط داخل ```json بهذا الشكل:\n```json\n{"name": "اسم التقرير", "ds": "sales_lines", "period": "this-y", "columns": ["date", "party", "net"], "group": ["party"], "measures": [{"f": "net", "agg": "sum"}], "pivot": "", "filters": [{"f": "item_kind", "op": "eq", "v": "منتج"}], "sort": {"f": "sum:net", "dir": "desc"}, "limit": 0}\n```\nإذا ما فيه تجميع اترك group و measures فارغة واستخدم columns. مفتاح الترتيب لقيمة مجمّعة يكون agg:field مثل sum:net، وللعدد count.'; };
    $('#rbq', form).addEventListener('input', gen); gen(); };
  if ($('#rbaiin')) $('#rbaiin').onclick = () => drawer('لصق تعريف التقرير', `<div class="field"><label for="rbpaste">رد الذكاء الاصطناعي</label><textarea class="input" id="rbpaste" rows="8" style="height:auto;padding:8px 12px;font-size:12px" placeholder="الصق الرد كاملاً…"></textarea></div>`, async () => {
    const txt = $('#rbpaste').value || '', m = txt.match(/```(?:json)?\s*([\s\S]*?)```/i), raw = m ? m[1] : txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1);
    let j; try { j = JSON.parse(raw.trim()); } catch { throw new Error('ما قدرت أقرأ JSON من الرد — انسخ الرد كاملاً مع كتلة ```json'); }
    if (!j || typeof j !== 'object' || !RB_DS[j.ds]) throw new Error('الرد ما فيه مصدر بيانات معروف (ds)');
    if (!rbOk(j.ds)) throw new Error('ليست لديك صلاحية على هذا المصدر');
    const keepName = d.name; d = rbClean(j); if (!d.name) d.name = keepName; drawCfg(); load(); toast('طُبّق تعريف التقرير — راجعه ثم احفظ'); }, 'تطبيق');
}

const RB_ROUTES = [
  [/^#\/report-builder$/, gate('report-builder', 'منشئ التقارير', 'reports|accounting', reportBuilderHome)],
  [/^#\/report-builder\/([\w-]+)(\?.*)?$/, m => gate('report-builder', 'منشئ التقارير', 'reports|accounting', reportBuilderView)(m[1], new URLSearchParams((m[2] || '').slice(1)))],
];
window.__rb = { rbCompute, rbClean, rbTpl, RB_TPL, xlsxBlob, remapBackup };   // exposed for tests


// ---------- router ----------
const stub = (key, title, what) => () => { shell(key, `<div class="page-head"><h1>${esc(title)}</h1></div>${empty('box', 'قيد البناء', what)}`); };
const ROUTES = [
  [/^#\/dashboard$/, dashboardView], [/^#\/invoices$/, invoicesView], [/^#\/invoices\/new$/, () => invoiceEditView(null)],
  [/^#\/invoices\/([\w-]+)\/edit$/, m => invoiceEditView(m[1])], [/^#\/invoices\/([\w-]+)$/, m => invoiceView(m[1])],
  [/^#\/customers$/, customersView], [/^#\/customers\/([\w-]+)$/, m => customerView(m[1])], [/^#\/items$/, itemsView],
  [/^#\/receipts$/, receiptsView], [/^#\/receipts\/new(\?.*)?$/, m => receiptNewView(new URLSearchParams((m[1] || '').slice(1)))],
  [/^#\/accounts$/, accountsView], [/^#\/trial-balance$/, trialBalanceView], [/^#\/settings$/, settingsView],
  ...OPS_ROUTES,
  [/^#\/purchases$/, () => { location.hash = '#/bills'; }], [/^#\/inventory$/, () => { location.hash = '#/warehouses'; }],
  ...POS_ROUTES,
  ...REPORT_ROUTES,
  ...EXT_ROUTES,
  ...EXT2_ROUTES,
  ...EXT3_ROUTES,
  ...PROJECT_ROUTES,
  ...THEME_ROUTES,
  ...DESIGN_ROUTES,
  ...FEAS_ROUTES,
  ...BACKUP_ROUTES,
  ...RB_ROUTES,
];
async function route() {
  const h = location.hash || '#/dashboard';
  $$('.drawer-bg').forEach(x => x.remove());
  try {
    const pm = h.match(PORTAL_RE); if (pm && api.mode === 'supabase') return portalPublicView(pm[1], pm[2]);
    const s = await api.session();
    if (!s) { recovering = false;
      if (h === '#/signup') return authView('signup'); if (h === '#/forgot' && api.mode === 'supabase') return forgotView();
      return authView(h === '#/login' ? 'login' : (LocalAPI.mode === api.mode && !localStorage.getItem('daftar-local-v1')?.includes('"email"') ? 'signup' : 'login')); }
    if (api.mode === 'supabase' && (recovering || h === '#/reset')) { if (location.hash !== '#/reset') { location.hash = '#/reset'; return; } return resetView(); }
    if (['#/login', '#/signup', '#/forgot'].includes(h)) { location.hash = '#/dashboard'; return; }
    if (!ORG) { $('#app').innerHTML = loading('جارٍ فتح حسابك…'); [ORG] = await Promise.all([api.currentOrg(), loadUI()]); applyTheme(); }
    if ((location.hash || '#/dashboard') !== h) return;   // the user moved on while we were loading
    if (NEW_ORG) return onboardingView();
    if (!ORG) { if (api.mode === 'supabase' && !(await api.whoami()).is_platform_admin) return noCompanyView(s.user?.email); return onboardingView(); }
    const r = ROUTES.find(([re]) => re.test(h));
    if (!r) { location.hash = '#/dashboard'; return; }
    await r[1](h.match(r[0]));
    $('#side')?.classList.remove('open'); $('#main')?.focus({ preventScroll: true }); window.scrollTo(0, 0);
    document.title = ($('#main h1')?.textContent || 'كرافت لاند') + ' — ' + (ORG?.name_ar || '');
  } catch (e) {
    fail(e);
    if ($('#main')) $('#main').innerHTML = `<div class="card empty">${icon('alert')}<h3 style="margin:12px 0 4px">تعذّر تحميل الصفحة</h3><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div>`;
    else $('#app').innerHTML = `<div class="auth"><div class="card empty">${icon('alert')}<h3>تعذّر فتح الحساب</h3><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div></div>`;
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('unhandledrejection', e => fail(e.reason));
pickBackend().then(route);
}

</script>
