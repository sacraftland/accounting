<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f6b3a%22/%3E%3Cpath d=%22M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E">
<title>كرافت لاند — النظام المحاسبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* generated from tokens.json — do not edit by hand */
:root{
  --c-bg: #f7f3ec;
  --c-surface: #fffdf9;
  --c-surface-2: #efe8dc;
  --c-border: #e2d8c8;
  --c-border-input: #8a7b66;
  --c-text: #2b241c;
  --c-text-muted: #6b5d4c;
  --c-accent: #4f6b3a;
  --c-accent-hover: #425a30;
  --c-accent-soft: #e6ecdc;
  --c-on-accent: #ffffff;
  --c-focus: #b0672b;
  --c-danger: #a8362a;
  --c-danger-soft: #f6e2dd;
  --c-success: #2f6b3f;
  --c-success-soft: #e1eedf;
  --c-warning: #8a5a00;
  --c-warning-soft: #f8ecd2;
  --c-info: #2d5f7a;
  --c-info-soft: #e0ecf2;
  --c-sidebar: #2f2a24;
  --c-on-sidebar: #f3ece0;
  --c-on-sidebar-muted: #c3b7a5;
  --font-sans: "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-xs: 12px; --lh-xs: 18px; --fw-xs: 500;
  --fs-sm: 14px; --lh-sm: 22px; --fw-sm: 400;
  --fs-base: 16px; --lh-base: 26px; --fw-base: 400;
  --fs-lg: 20px; --lh-lg: 30px; --fw-lg: 600;
  --fs-xl: 28px; --lh-xl: 38px; --fw-xl: 700;
  --fs-display: 40px; --lh-display: 52px; --fw-display: 700;
  --sp-0: 0px;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
  --sh-card: 0 1px 2px rgba(60,40,20,.06), 0 1px 3px rgba(60,40,20,.10);
  --sh-pop: 0 12px 32px rgba(60,40,20,.18);
  --t-fast: 120ms; --t-base: 200ms; --ease: cubic-bezier(.2,.8,.2,1);
  --l-sidebar: 264px;
  --l-header: 60px;
  --l-content-max: 1280px;
  --l-form-max: 880px;
  --l-touch-target: 44px;
  --l-table-row: 44px;
  --l-pos-key: 64px;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);font-size:var(--fs-sm);line-height:var(--lh-sm);background:var(--c-bg);color:var(--c-text);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums lining-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0}
h1{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:var(--fw-xl)}
h2{font-size:var(--fs-lg);line-height:var(--lh-lg);font-weight:var(--fw-lg)}
h3{font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600}
.muted{color:var(--c-text-muted)}
.xs{font-size:var(--fs-xs);line-height:var(--lh-xs)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flip{transform:scaleX(-1)} [dir=ltr] .flip{transform:none}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:var(--l-sidebar) 1fr;min-height:100vh}
.side{background:var(--c-sidebar);color:var(--c-on-sidebar);padding:var(--sp-5) var(--sp-4);position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--fs-lg);margin-bottom:var(--sp-6)}
.brand .mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--c-accent);display:grid;place-items:center;color:var(--c-on-accent)}
.nav-group{color:var(--c-on-sidebar-muted);font-size:var(--fs-xs);margin:var(--sp-5) var(--sp-3) var(--sp-2)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--c-on-sidebar);text-decoration:none;min-height:40px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);font-weight:600}
.main{min-width:0}
.top{height:var(--l-header);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-6);position:sticky;top:0;z-index:5}
.top .search{flex:1;max-width:420px}
.top .sp{flex:1}
.menu-btn{display:none}
.page{max-width:var(--l-content-max);margin:0 auto;padding:var(--sp-6)}
.section{margin-bottom:var(--sp-7)}
.section > h2{margin-bottom:var(--sp-2)}
.section > p.muted{margin:0 0 var(--sp-4)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--sh-card);padding:var(--sp-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center}
.grid{display:grid;gap:var(--sp-4)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}

/* buttons */
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 var(--sp-4);border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;transition:background var(--t-fast) var(--ease),border-color var(--t-fast);white-space:nowrap}
.btn.sm{height:32px;padding:0 var(--sp-3);font-size:var(--fs-xs)} .btn.lg{height:48px;padding:0 var(--sp-5);font-size:var(--fs-base)}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)} .btn.primary:hover{background:var(--c-accent-hover)}
.btn.secondary{background:var(--c-surface);color:var(--c-text);border-color:var(--c-border-input)} .btn.secondary:hover{background:var(--c-surface-2)}
.btn.ghost{background:transparent;color:var(--c-text)} .btn.ghost:hover{background:var(--c-surface-2)}
.btn.danger{background:var(--c-danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.icon{width:40px;padding:0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:500}
.input{font:inherit;font-size:var(--fs-base);height:40px;padding:0 12px;border:1px solid var(--c-border-input);border-radius:var(--r-sm);background:var(--c-surface);color:var(--c-text);width:100%}
.input:hover{border-color:var(--c-text-muted)}
.input:focus{outline:2px solid var(--c-focus);outline-offset:0;border-color:var(--c-focus)}
.input[readonly]{background:var(--c-surface-2)}
.input.err{border-color:var(--c-danger)}
.help{font-size:var(--fs-xs);color:var(--c-text-muted)} .help.err{color:var(--c-danger)}
.affix{position:relative} .affix .input{padding-left:52px;padding-right:12px;text-align:right;direction:ltr}
.affix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--c-text-muted)}
.lead{position:relative} .lead .input{padding-inline-start:40px} .lead svg{position:absolute;inset-inline-start:12px;top:10px;color:var(--c-text-muted)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--c-text-muted) 50%),linear-gradient(135deg,var(--c-text-muted) 50%,transparent 50%);background-position:14px 18px,19px 18px;background-size:5px 5px;background-repeat:no-repeat}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.b-draft{background:var(--c-surface-2);color:var(--c-text-muted)}
.b-info{background:var(--c-info-soft);color:var(--c-info)}
.b-ok{background:var(--c-success-soft);color:var(--c-success)}
.b-warn{background:var(--c-warning-soft);color:var(--c-warning)}
.b-bad{background:var(--c-danger-soft);color:var(--c-danger)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* stat */
.stat .label{color:var(--c-text-muted)}
.stat .val{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:700;margin:4px 0}
.up{color:var(--c-success)} .down{color:var(--c-danger)}
.spark{width:100%;height:36px;margin-top:8px}

/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:0 var(--sp-4);height:var(--l-table-row);text-align:start;border-bottom:1px solid var(--c-border);white-space:nowrap}
th{background:var(--c-surface-2);font-weight:600;color:var(--c-text-muted);font-size:var(--fs-xs);position:sticky;top:0}
td.amt,th.amt{text-align:end}
tbody tr:hover{background:var(--c-bg)}
tfoot td{font-weight:700;background:var(--c-surface-2);border-bottom:0}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--c-surface-2),var(--c-border),var(--c-surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* editor */
.editor td{padding:4px 6px} .editor .input{height:36px;font-size:var(--fs-sm)}
.totals{width:320px;margin-inline-start:auto;margin-top:var(--sp-4)}
.totals div{display:flex;justify-content:space-between;padding:6px 0}
.totals .grand{border-top:2px solid var(--c-text);font-size:var(--fs-lg);font-weight:700;padding-top:10px;margin-top:4px}

/* tree */
.tree{list-style:none;margin:0;padding:0}
.tree li{display:flex;align-items:center;gap:8px;height:38px;padding-inline-start:calc(var(--d,0) * 22px)}
.tree .code{color:var(--c-text-muted);width:48px}
.tree .bal{margin-inline-start:auto}
.tree .grp{font-weight:700}

/* toast & modal */
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-md);box-shadow:var(--sh-pop);background:var(--c-surface);border-inline-start:4px solid;min-width:280px}
.toast.ok{border-color:var(--c-success)} .toast.bad{border-color:var(--c-danger)} .toast.warn{border-color:var(--c-warning)}
.modal-demo{position:relative;border-radius:var(--r-lg);background:rgba(43,36,28,.45);padding:var(--sp-6);display:grid;place-items:center}
.modal{background:var(--c-surface);border-radius:var(--r-lg);box-shadow:var(--sh-pop);width:min(440px,100%);padding:var(--sp-5)}
.modal footer{display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-5)}

/* empty */
.empty{text-align:center;padding:var(--sp-7) var(--sp-4)}
.empty svg{width:40px;height:40px;color:var(--c-text-muted);stroke-width:1.5}

/* stepper */
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0}
.steps li{flex:1;display:flex;align-items:center;gap:8px;color:var(--c-text-muted)}
.steps li:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--c-border);margin:0 8px}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c-border);font-weight:700;background:var(--c-surface)}
.steps .done .n{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
.steps .done{color:var(--c-text)} .steps .done:not(:last-child)::after{background:var(--c-accent)}
.steps .cur .n{border-color:var(--c-accent);color:var(--c-accent)} .steps .cur{color:var(--c-text);font-weight:600}

/* POS */
.pos{display:grid;grid-template-columns:1fr 340px;gap:var(--sp-4)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{min-height:var(--l-pos-key);border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface);padding:10px;text-align:start;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile:hover{border-color:var(--c-accent);background:var(--c-accent-soft)}
.cart{display:flex;flex-direction:column;gap:8px}
.cart .line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--c-border)}
.offline{background:var(--c-warning-soft);color:var(--c-warning);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;display:flex;gap:8px;align-items:center}

/* print preview */
.paper{background:#fff;color:#000;border:1px solid var(--c-border);box-shadow:var(--sh-card);padding:28px;max-width:720px;margin:auto;font-size:13px}
.paper table th{background:#f2f2f2;color:#000;position:static}
.paper th,.paper td{height:32px;padding:0 8px;border-bottom:1px solid #ddd}
.paper .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:12px}
.paper .qr{width:110px;height:110px;display:grid;grid-template-columns:repeat(11,1fr)}
.paper .qr i{background:#000}

/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw div{border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;background:var(--c-surface);font-size:var(--fs-xs)}
.sw b{display:block;height:48px}
.sw span{display:block;padding:6px 8px}
.type-row{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--c-border)}
.type-row .tag{width:80px;color:var(--c-text-muted);font-size:var(--fs-xs)}

/* mobile */
.bottom-bar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:20;box-shadow:var(--sh-pop)}
  .menu-btn{display:inline-flex}
  .top{padding:0 var(--sp-3);gap:var(--sp-2)} .top .search{display:none}
  .top select.input{max-width:150px;font-size:var(--fs-sm);padding-inline-end:28px}
  .top .new-lbl{display:none} .top .btn.primary.sm{width:32px;padding:0}
  .paper{padding:16px;overflow-x:auto;font-size:12px} .paper .hd{flex-direction:column}
  .paper th,.paper td{padding:0 4px}
  .page{padding:var(--sp-4);padding-bottom:96px}
  .g4{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}
  .pos{grid-template-columns:1fr}
  .totals{width:100%}
  .bottom-bar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--c-surface);border-top:1px solid var(--c-border);height:64px;z-index:10}
  .bottom-bar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--c-text-muted);text-decoration:none}
  .bottom-bar a.on{color:var(--c-accent);font-weight:600}
  .steps .lbl{display:none}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr} }

/* ---- app-specific (on top of the design-system primitives) ---- */
[hidden]{display:none!important}
a{color:var(--c-accent)}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.page-head h1{flex:1;min-width:200px}
.crumb{color:var(--c-text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin-bottom:var(--sp-4);overflow-x:auto}
.tabs button,.tabs a{display:inline-flex;align-items:center;text-decoration:none;font:inherit;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--c-text-muted);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tabs button.on,.tabs a.on{color:var(--c-text);border-color:var(--c-accent);font-weight:600}
tbody tr.click{cursor:pointer}
td a.rowlink{color:inherit;text-decoration:none;font-weight:600}
.auth{min-height:100vh;display:grid;place-items:center;padding:var(--sp-5);background:var(--c-bg)}
.auth .card{width:min(440px,100%);padding:var(--sp-6)}
.auth .brand{color:var(--c-text);justify-content:center;margin-bottom:var(--sp-5)}
.auth form{display:grid;gap:var(--sp-4)}
.wide{width:100%}
.note{background:var(--c-info-soft);color:var(--c-info);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-xs);line-height:var(--lh-xs)}
.note.warn{background:var(--c-warning-soft);color:var(--c-warning)}
.note.bad{background:var(--c-danger-soft);color:var(--c-danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.form-grid .full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;margin-bottom:var(--sp-3)}
.drawer-bg{position:fixed;inset:0;background:rgba(43,36,28,.45);z-index:40;display:flex;justify-content:flex-end}
[dir=rtl] .drawer-bg{justify-content:flex-start}
.drawer{background:var(--c-surface);width:min(520px,100%);height:100%;overflow:auto;padding:var(--sp-5);box-shadow:var(--sh-pop);display:flex;flex-direction:column;gap:var(--sp-4)}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer footer{margin-top:auto;display:flex;gap:8px;justify-content:flex-end;padding-top:var(--sp-4);border-top:1px solid var(--c-border)}
.toasts{position:fixed;bottom:var(--sp-5);inset-inline-end:var(--sp-5);display:grid;gap:8px;z-index:60}
.loading-screen{min-height:60vh;display:grid;place-items:center;text-align:center;gap:12px}
.loading-screen .spin{width:32px;height:32px;margin:auto;color:var(--c-accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--c-text-muted)} .kv dd{margin:0}
.editor .input.num{text-align:right}
.editor select.input{padding-inline-end:28px}
.line-total{font-weight:600}
.amt-big{font-size:var(--fs-xl);font-weight:700}
.alloc td{height:48px}
.logo-prev{width:72px;height:72px;border:1px dashed var(--c-border-input);border-radius:var(--r-md);display:grid;place-items:center;overflow:hidden;background:var(--c-surface-2)}
.logo-prev img{max-width:100%;max-height:100%}
.tree-tbl td:first-child{padding-inline-start:calc(16px + var(--d,0)*22px)}
.tree-tbl tr.grp td{font-weight:700;background:var(--c-bg)}
.ok-line{display:flex;align-items:center;gap:8px}
.mode-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--c-warning-soft);color:var(--c-warning);font-weight:600}
/* print: only the invoice paper */
@media print{
  body{background:#fff}
  .side,.top,.bottom-bar,.no-print,.toasts{display:none!important}
  .shell{display:block}
  .page{padding:0;max-width:none}
  .paper{border:0;box-shadow:none;max-width:none;padding:0}
  @page{size:A4;margin:12mm}
}
@media (max-width:900px){
  .form-grid{grid-template-columns:1fr}
  .editor-lines table thead{display:none}
  .editor-lines table, .editor-lines tbody, .editor-lines tr, .editor-lines td{display:block;width:100%}
  .editor-lines tr{border-bottom:1px solid var(--c-border);padding:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .editor-lines td{border:0;height:auto;padding:0 4px}
  .editor-lines td.c-item,.editor-lines td.c-desc{grid-column:1/-1}
  .editor-lines td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--c-text-muted)}
  .toasts{inset-inline:var(--sp-3);bottom:76px}
  .list-tbl thead{display:none}
  .list-tbl tr{display:grid;grid-template-columns:1fr auto;padding:10px 12px;border-bottom:1px solid var(--c-border);gap:2px 8px}
  .list-tbl td{height:auto;border:0;padding:0}
  .list-tbl td.m-hide{display:none}
  .list-tbl td.m-sub{color:var(--c-text-muted);font-size:var(--fs-xs)}

// ---- QR code encoder (byte mode, error correction M, versions 1-25) ----
// Written for this app. Algorithm per ISO/IEC 18004.
const QR = (() => {
  const ECC_M = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28];
  const BLK_M = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21];

  const gmul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };

    for (let i = 0; i < n; i++) { for (let j = 0; j < n; j++) { r[j] = gmul(r[j], root); if (j+1 < n) r[j] ^= r[j+1]; } root = gmul(root, 2); } return r; }

    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= gmul(c, f)); } return r; }

    const res = [6]; for (let p = v*4+10; res.length < n; p -= step) res.splice(1, 0, p); return res; }

  function encode(bytes) {

    const cap = dataCap(v)*8; put(0, Math.min(4, cap - bits.length)); while (bits.length % 8) bits.push(0);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i+8).reduce((a, b) => a*2+b, 0));

    const size = v*4+17; const M = [...Array(size)].map(() => Array(size).fill(false)); const F = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };

      if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4); } };

      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(a+dx, b+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const drawFormat = mask => { const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i)); set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14-i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size-1-i, 8, bit(i)); for (let i = 8; i < 15; i++) set(8, size-15+i, bit(i)); set(8, size-8, true); };

    const penalty = () => { let p = 0, dark = 0;
      for (let a = 0; a < size; a++) { let rx = 1, ry = 1;
        for (let b = 1; b < size; b++) { if (M[a][b] === M[a][b-1]) { rx++; if (rx === 5) p += 3; else if (rx > 5) p++; } else rx = 1;
          if (M[b][a] === M[b-1][a]) { ry++; if (ry === 5) p += 3; else if (ry > 5) p++; } else ry = 1; } }
      for (let y = 0; y < size-1; y++) for (let x = 0; x < size-1; x++) { const c = M[y][x]; if (c === M[y][x+1] && c === M[y+1][x] && c === M[y+1][x+1]) p += 3; }
      M.forEach(r => r.forEach(c => dark += c)); p += Math.floor(Math.abs(dark*20 - size*size*10) / (size*size)) * 10; return p; };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const pp = penalty(); if (pp < bestP) { bestP = pp; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return M;
  }

  function svg(matrix, px = 4) { const n = matrix.length, q = 4, s = n + q*2; let d = '';
    matrix.forEach((row, y) => row.forEach((c, x) => { if (c) d += `M${x+q},${y+q}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${s*px}" height="${s*px}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }

  // ZATCA TLV: 1 seller, 2 VAT no., 3 timestamp, 4 total incl. VAT, 5 VAT
  function zatcaTLV({ seller, vatNo, timestamp, total, vat }) {
    const enc = new TextEncoder(), out = [];
    [seller, vatNo, timestamp, total, vat].forEach((val, i) => { const b = enc.encode(String(val)); if (b.length > 255) throw new Error('TLV value too long'); out.push(i+1, b.length, ...b); });
    let bin = ''; out.forEach(b => bin += String.fromCharCode(b)); return btoa(bin);
  }
  const ascii = s => Array.from(s, c => c.charCodeAt(0));
  return { encode, svg, zatcaTLV, ascii };
})();

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { throw new AppError('تعذّر الحفظ في المتصفح — المساحة ممتلئة؟'); } };
  load();
  const tx = fn => { const snap = JSON.stringify(S); try { const r = fn(); save(); return r; } catch (e) { S = JSON.parse(snap); throw e; } };
  const hash = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('daftar:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
  const me = () => { if (!S.session) throw new AppError('سجّل الدخول أولاً'); return S.session; };
  const org = () => { const m = S.members.find(m => m.user_id === me()); return m ? S.orgs.find(o => o.id === m.org_id) : null; };
  const O = () => { const o = org(); if (!o) throw new AppError('لا توجد شركة'); return o; };
  const acct = k => { const a = S.accounts.find(a => a.org_id === O().id && a.system_key === k); if (!a) throw new AppError('حساب النظام غير موجود: ' + k); return a.id; };
  const next = s => { const k = O().id + ':' + s; S.counters[k] = (S.counters[k] || 0) + 1; return S.counters[k]; };
  const mine = list => list.filter(r => r.org_id === O().id);

  function postEntry(date, memo, source_type, source_id, lines) {
    const d = lines.reduce((a, l) => a + (l.debit || 0), 0), c = lines.reduce((a, l) => a + (l.credit || 0), 0);
    if (d !== c || d === 0) throw new AppError(`القيد غير متوازن (مدين ${d} — دائن ${c})`);
    const e = { id: uid(), org_id: O().id, number: next('je'), entry_date: date, memo, source_type, source_id, status: 'posted', created_at: new Date().toISOString() };
    S.entries.push(e);
    lines.filter(l => (l.debit || 0) + (l.credit || 0) > 0).forEach(l => S.jlines.push({ id: uid(), entry_id: e.id, org_id: e.org_id, account_id: l.account_id, party_id: l.party_id || null, cost_center_id: null, debit: l.debit || 0, credit: l.credit || 0 }));
    return e.id;
  }

  return {
    mode: 'local',
    async session() { return S.session ? { user: S.users.find(u => u.id === S.session) } : null; },
    async signUp(email, pw) {
      email = email.trim().toLowerCase(); if (pw.length < 8) throw new AppError('كلمة المرور 8 أحرف على الأقل');
      if (S.users.some(u => u.email === email)) throw new AppError('هذا البريد مسجّل — سجّل الدخول');
      const u = { id: uid(), email, pw: await hash(pw) }; S.users.push(u); S.session = u.id; save(); return u;
    },
    async signIn(email, pw) {
      const u = S.users.find(u => u.email === email.trim().toLowerCase());
      if (!u || u.pw !== await hash(pw)) throw new AppError('البريد أو كلمة المرور غير صحيحة'); S.session = u.id; save(); return u;
    },
    async signOut() { S.session = null; save(); },
    async currentOrg() { return org(); },
    async createOrg(f) {
      if (f.vat_number && !VAT_RE.test(f.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      return tx(() => {
        const o = { id: uid(), name_ar: f.name_ar, vat_number: f.vat_number || null, cr_number: f.cr_number || null, city: f.city, district: f.district, street: f.street,
          building_no: f.building_no, postal_code: f.postal_code, sector: f.sector || 'general', logo_path: null, invoice_footer: '', plan: 'trial',
          trial_ends_at: new Date(Date.now() + 14 * 864e5).toISOString(), created_at: new Date().toISOString() };
        S.orgs.push(o); S.members.push({ org_id: o.id, user_id: me(), role: 'owner' });
        const ids = {}; CHART.forEach(([code, parent, ar, en, type, postable, key]) => { ids[code] = uid(); });
        CHART.forEach(([code, parent, ar, en, type, postable, key]) => S.accounts.push({ id: ids[code], org_id: o.id, parent_id: parent ? ids[parent] : null, code, name_ar: ar, name_en: en, type, is_postable: postable, system_key: key }));
        return o;
      });
    },
    async updateOrg(f) {
      if (f.vat_number && !VAT_RE.test(f.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      return tx(() => Object.assign(O(), f));
    },
    async listAccounts() { return mine(S.accounts).sort((a, b) => a.code.localeCompare(b.code)); },
    async trialBalance() {
      const accs = mine(S.accounts), by = {};
      mine(S.jlines).forEach(l => { const r = by[l.account_id] ||= { debit: 0, credit: 0 }; r.debit += l.debit; r.credit += l.credit; });
      return accs.filter(a => by[a.id]).map(a => ({ account_id: a.id, code: a.code, name_ar: a.name_ar, type: a.type, ...by[a.id], balance: by[a.id].debit - by[a.id].credit }))
        .sort((a, b) => a.code.localeCompare(b.code));
    },
    async listParties(kind) { return mine(S.parties).filter(p => !kind || p.kind === kind || p.kind === 'both').sort((a, b) => a.name.localeCompare(b.name, 'ar')); },
    async saveParty(p) {
      if (!p.name?.trim()) throw new AppError('الاسم مطلوب');
      if (p.vat_number && !VAT_RE.test(p.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      return tx(() => { if (p.id) { const r = S.parties.find(x => x.id === p.id && x.org_id === O().id); Object.assign(r, p); return r; }
        const r = { id: uid(), org_id: O().id, kind: 'customer', country: 'SA', is_active: true, created_at: new Date().toISOString(), ...p }; S.parties.push(r); return r; });
    },
    async listItems() {
      const items = mine(S.items), q = {}; mine(S.stock).forEach(m => q[m.item_id] = (q[m.item_id] || 0) + m.qty);
      return items.map(i => ({ ...i, on_hand: q[i.id] || 0 })).sort((a, b) => a.name_ar.localeCompare(b.name_ar, 'ar'));
    },
    async saveItem(i) {
      if (!i.name_ar?.trim()) throw new AppError('اسم الصنف مطلوب');
      if (['Z', 'E'].includes(i.tax_category) && !i.exemption_reason) throw new AppError('سبب الإعفاء أو النسبة الصفرية مطلوب');
      return tx(() => {
        const dup = mine(S.items).find(x => x.id !== i.id && ((i.sku && x.sku === i.sku) || (i.barcode && x.barcode === i.barcode)));
        if (dup) throw new AppError('رمز الصنف أو الباركود مستخدم لصنف آخر');
        if (i.id) { const r = S.items.find(x => x.id === i.id && x.org_id === O().id); Object.assign(r, i); return r; }
        const r = { id: uid(), org_id: O().id, is_active: true, created_at: new Date().toISOString(), ...i }; S.items.push(r); return r;
      });
    },
    async listDocuments(kinds) {
      const parties = Object.fromEntries(mine(S.parties).map(p => [p.id, p]));
      return mine(S.documents).filter(d => !kinds || kinds.includes(d.kind)).map(d => ({ ...d, party_name: parties[d.party_id]?.name || 'عميل نقدي' }))
        .sort((a, b) => (b.issue_date + b.created_at).localeCompare(a.issue_date + a.created_at));
    },
    async getDocument(id) {
      const d = mine(S.documents).find(d => d.id === id); if (!d) throw new AppError('المستند غير موجود');
      const lines = S.lines.filter(l => l.document_id === id).sort((a, b) => a.line_no - b.line_no);
      const party = S.parties.find(p => p.id === d.party_id) || null;
      const entry = S.entries.find(e => e.source_type === 'document' && e.source_id === id);
      const accs = Object.fromEntries(mine(S.accounts).map(a => [a.id, a]));
      const jl = entry ? S.jlines.filter(l => l.entry_id === entry.id).map(l => ({ ...l, code: accs[l.account_id].code, name_ar: accs[l.account_id].name_ar })) : [];
      const pays = S.allocs.filter(a => a.document_id === id).map(a => ({ ...a, payment: S.payments.find(p => p.id === a.payment_id) }));
      return { ...d, lines, party, entry, journal: jl, payments: pays };
    },
    async saveDraft(doc, lines) {
      return tx(() => {
        let d;
        if (doc.id) { d = mine(S.documents).find(x => x.id === doc.id); if (d.status !== 'draft') throw new AppError('لا يمكن تعديل مستند مرحّل — أصدر إشعاراً دائناً');
          Object.assign(d, doc); S.lines = S.lines.filter(l => l.document_id !== d.id); }
        else { d = { id: uid(), org_id: O().id, status: 'draft', payment_status: 'unpaid', amount_paid: 0, zatca_uuid: uid(), zatca_status: 'not_sent', currency: 'SAR', created_at: new Date().toISOString(), ...doc }; S.documents.push(d); }
        lines.forEach((l, i) => S.lines.push({ id: uid(), document_id: d.id, org_id: d.org_id, line_no: i + 1, ...l }));
        return d.id;
      });
    },
    async postSalesInvoice(id) {
      return tx(() => {
        const d = mine(S.documents).find(x => x.id === id);
        if (!d || d.status !== 'draft') throw new AppError('المستند مرحّل مسبقاً');
        const party = S.parties.find(p => p.id === d.party_id);
        if (d.kind === 'tax_invoice' && !party?.vat_number) throw new AppError('الفاتورة الضريبية تحتاج رقم ضريبي للعميل');
        const lines = S.lines.filter(l => l.document_id === id);
        if (!lines.length) throw new AppError('أضف سطراً واحداً على الأقل');
        let sub = 0, vat = 0; lines.forEach(l => { const c = lineCalc(l); l.line_net = c.net; l.line_vat = c.vat; sub += c.net; vat += c.vat; });
        if (sub <= 0) throw new AppError('إجمالي الفاتورة يجب أن يكون أكبر من صفر');
        Object.assign(d, { subtotal: sub, vat_total: vat, total: sub + vat });
        const rev = {}; lines.forEach(l => { const it = S.items.find(i => i.id === l.item_id); const a = it?.revenue_account_id || acct(it?.kind === 'service' ? 'service_revenue' : 'sales'); rev[a] = (rev[a] || 0) + l.line_net; });
        const jl = [{ account_id: acct('ar'), party_id: d.party_id, debit: d.total }, ...Object.entries(rev).map(([a, v]) => ({ account_id: a, credit: v }))];
        if (vat > 0) jl.push({ account_id: acct('vat_out'), credit: vat });
        let cogs = 0;
        lines.forEach(l => { const it = S.items.find(i => i.id === l.item_id); if (!it || !it.track_stock) return; l.unit_cost = it.avg_cost || 0;
          S.stock.push({ id: uid(), org_id: d.org_id, item_id: it.id, qty: -Number(l.qty), unit_cost: l.unit_cost, source_type: 'sale', source_id: d.id, move_date: d.issue_date }); cogs += Number(l.qty) * l.unit_cost; });
        cogs = Math.round(cogs); if (cogs > 0) jl.push({ account_id: acct('cogs'), debit: cogs }, { account_id: acct('inventory'), credit: cogs });
        postEntry(d.issue_date, 'فاتورة مبيعات', 'document', d.id, jl);
        const n = next('inv'); Object.assign(d, { status: 'posted', number: 'INV-' + String(n).padStart(5, '0'), posted_at: new Date().toISOString(), zatca_status: 'pending', zatca_icv: n });
        return d.id;
      });
    },
    async deleteDraft(id) { return tx(() => { const d = mine(S.documents).find(x => x.id === id); if (d?.status !== 'draft') throw new AppError('لا يمكن حذف مستند مرحّل');
      S.documents = S.documents.filter(x => x.id !== id); S.lines = S.lines.filter(l => l.document_id !== id); }); },
    async listPayments() { const parties = Object.fromEntries(mine(S.parties).map(p => [p.id, p]));
      return mine(S.payments).map(p => ({ ...p, party_name: parties[p.party_id]?.name || '—' })).sort((a, b) => (b.pay_date + b.created_at).localeCompare(a.pay_date + a.created_at)); },
    async createReceipt(r) {
      return tx(() => {
        const amount = Number(r.amount); if (!(amount > 0)) throw new AppError('أدخل مبلغاً صحيحاً');
        const allocated = (r.allocations || []).reduce((a, x) => a + x.amount, 0);
        if (allocated > amount) throw new AppError('المبالغ الموزعة أكبر من مبلغ السند');
        (r.allocations || []).forEach(x => { const d = mine(S.documents).find(d => d.id === x.document_id); if (!d || d.status !== 'posted') throw new AppError('فاتورة غير صالحة');
          if (x.amount > d.total - d.amount_paid) throw new AppError(`المبلغ يتجاوز المتبقي على ${d.number}`); });
        const p = { id: uid(), org_id: O().id, kind: 'receipt', party_id: r.party_id, pay_date: r.pay_date, amount, method: r.method, reference: r.reference || '',
          cash_account_id: acct(r.method === 'cash' ? 'cash' : r.method === 'card' ? 'card_clearing' : 'bank'), status: 'posted', created_at: new Date().toISOString() };
        S.payments.push(p);
        postEntry(p.pay_date, 'سند قبض', 'payment', p.id, [{ account_id: p.cash_account_id, debit: amount }, { account_id: acct('ar'), party_id: p.party_id, credit: amount }]);
        (r.allocations || []).forEach(x => { S.allocs.push({ payment_id: p.id, document_id: x.document_id, amount: x.amount });
          const d = mine(S.documents).find(d => d.id === x.document_id); d.amount_paid += x.amount; d.payment_status = d.amount_paid >= d.total ? 'paid' : 'partial'; });
        p.number = 'RV-' + String(next('rv')).padStart(5, '0');
        return p.id;
      });
    },
    async partyStatement(partyId) {
      const rows = [];
      mine(S.documents).filter(d => d.party_id === partyId && d.status === 'posted').forEach(d => rows.push({ date: d.issue_date, ref: d.number, what: 'فاتورة', debit: d.total, credit: 0, link: '#/invoices/' + d.id }));
      mine(S.payments).filter(p => p.party_id === partyId).forEach(p => rows.push({ date: p.pay_date, ref: p.number, what: 'سند قبض', debit: 0, credit: p.amount }));
      rows.sort((a, b) => a.date.localeCompare(b.date)); let bal = 0; rows.forEach(r => { bal += r.debit - r.credit; r.balance = bal; }); return rows;
    },
    // dev helpers
    async resetAll() { S = blank(); save(); },
  };
})();

      <p class="xs muted" id="asum" style="margin-top:6px"></p>` : `<p class="muted">${party ? 'لا توجد فواتير مفتوحة لهذا العميل — سيُسجَّل المبلغ دفعة على الحساب.' : 'اختر العميل لعرض فواتيره المفتوحة.'}</p>`;
    sumAlloc();
  };
  const sumAlloc = () => { const a = toHalalas($('#f-amount').value || 0), s = Object.values(alloc).reduce((x, y) => x + y, 0); const el = $('#asum');
    if (el) el.textContent = `الموزَّع ${money(s)} من ${money(Number.isFinite(a) ? a : 0)}${a > s ? ` — يبقى ${money(a - s)} دفعة على الحساب` : ''}`; };
  const autoAlloc = () => { alloc = {}; let a = toHalalas($('#f-amount').value || 0); if (!Number.isFinite(a)) a = 0;
    const mine = openDocs.filter(d => (d.party_id || '') === party).sort((x, y) => x.issue_date.localeCompare(y.issue_date));
    if (pre) mine.sort((x, y) => (y.id === pre) - (x.id === pre));
    mine.forEach(d => { const take = Math.min(a, d.total - d.amount_paid); if (take > 0) { alloc[d.id] = take; a -= take; } }); drawAlloc(); };
  $('#f-party').onchange = e => { party = e.target.value; autoAlloc(); };
  $('#f-amount').oninput = autoAlloc;
  $('#allocs').addEventListener('input', e => { const i = e.target.closest('[data-doc]'); if (!i) return; const v = toHalalas(i.value || 0); alloc[i.dataset.doc] = Number.isFinite(v) ? v : 0; sumAlloc(); });

    const amount = toHalalas(f.amount); if (!(amount > 0)) return err.textContent = 'أدخل المبلغ المستلم';

    $('[type=submit]', e.target).disabled = true;

async function accountsView() {

  const bal = Object.fromEntries(tb.map(r => [r.account_id, Number(r.balance)])), kids = {};
  accs.forEach(a => (kids[a.parent_id || 'root'] ||= []).push(a));

  const sign = a => ['asset', 'expense'].includes(a.type) ? 1 : -1;
  const rows = []; const walk = (a, d) => { rows.push({ a, d }); (kids[a.id] || []).forEach(k => walk(k, d + 1)); }; (kids.root || []).forEach(a => walk(a, 0)); accs.sorted = rows.map(r => r.a);

  const today = riyadhToday(), back = n => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh' }).format(new Date(Date.now() - n * 864e5));

}

const MODULES = [['sales', 'المبيعات'], ['purchases', 'المشتريات'], ['expenses', 'المصروفات'], ['inventory', 'المخزون'], ['manufacturing', 'التصنيع'],
  ['accounting', 'المحاسبة والقيود'], ['reports', 'التقارير'], ['hr', 'الموارد البشرية'], ['settings', 'إعدادات المنشأة'], ['users', 'المستخدمون والصلاحيات'], ['feasibility', 'دراسات الجدوى'], ['backup', 'النسخ الاحتياطي']];
const ACTIONS = [['view', 'عرض'], ['create', 'إنشاء وتعديل'], ['post', 'اعتماد وترحيل']];
const can = (m, a = 'view') => { const p = ORG?.perms; if (api.mode !== 'supabase' || !p || p._owner) return true;
  return a === 'view' ? ['view', 'create', 'post'].some(x => p[m]?.includes(x)) : !!p[m]?.includes(a); };
const fq = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 4 });
const serverOnly = (key, title) => { shell(key, `<div class="page-head"><h1>${esc(title)}</h1></div>${empty('lock', 'تعمل هذه الوحدة عند الربط بالخادم', 'وضع التجربة يغطي الفواتير والسندات فقط. اربط النظام بـ Supabase من الإعدادات.')}`); };
const denied = (key, title) => { shell(key, `<div class="page-head"><h1>${esc(title)}</h1></div>${empty('lock', 'ليست لديك صلاحية', 'اطلب من مدير النظام إضافة هذه الصلاحية لدورك.')}`); };
const gate = (key, title, module, fn) => async (...a) => { if (api.mode !== 'supabase') return serverOnly(key, title); if (!module.split('|').some(m => can(m))) return denied(key, title); return fn(...a); };
const optList = (rows, val, blank) => (blank ? `<option value="">${esc(blank)}</option>` : '') + rows.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('');
const acctOpts = (accs, val, blank) => optList(accs.map(a => [a.id, `${a.code} — ${a.name_ar}`]), val, blank);
const payAccts = accs => accs.filter(a => a.is_postable && (['cash', 'bank', 'card_clearing', 'custody'].includes(a.system_key) || (a.type === 'asset' && /^110/.test(a.code))));
const expAccts = accs => [...accs.filter(a => a.is_postable && a.type === 'expense' && !['cogs', 'stock_variance'].includes(a.system_key)), ...accs.filter(a => a.code === '1501')];
const ccField = (ccs, val, label = 'المشروع / مركز التكلفة') => ccs?.filter(c => c.status !== 'closed' || c.id === val).length ? `<div class="field"><label for="f-cost_center_id">${label}</label><select class="input" id="f-cost_center_id" name="cost_center_id">${optList(ccs.filter(c => c.status !== 'closed' || c.id === val).map(c => [c.id, `${c.code} — ${c.name}`]), val, '— بدون —')}</select></div>` : '';
const statusBadge = d => d.status === 'draft' ? (d.submitted_at ? badge(['بانتظار الاعتماد', 'b-warn']) : badge(['مسودة', 'b-draft'])) : d.status === 'void' ? badge(['ملغى', 'b-bad']) : badge(['مرحّل', 'b-ok']);
const confirmBtn = (btn, label = 'اضغط مرة أخرى للتأكيد') => { if (btn.dataset.sure) return true; btn.dataset.sure = 1; btn.textContent = label; setTimeout(() => { delete btn.dataset.sure; }, 4000); return false; };
const onBusy = async (btns, fn) => { btns.forEach(b => b.disabled = true); try { await fn(); } catch (x) { fail(x); btns.forEach(b => b.disabled = false); throw x; } };

async function docListView(key) {
  const c = DOCS[key]; shell(key, loading());
  const docs = await api.listDocuments(c.kinds.map(k => k[0]));
  let tab = sessionStorage.getItem('tab-' + key) || 'all';
  const sets = { all: docs, draft: docs.filter(d => d.status === 'draft' && !d.submitted_at), pending: docs.filter(d => d.status === 'draft' && d.submitted_at),
    open: docs.filter(d => d.status === 'posted' && d.payment_status !== 'paid'), posted: docs.filter(d => d.status === 'posted') };
  const tabs = [['all', 'الكل'], ['pending', 'بانتظار الاعتماد'], ['draft', 'مسودات'], ...(c.issue || c.needsSource ? [['posted', c.issue ? 'مُصدرة' : 'مرحّلة']] : [['open', 'غير مسددة'], ['posted', 'مرحّلة']])];
  const render = () => {
    const f = sets[tab] || docs;
    $('#main').innerHTML = `<div class="page-head"><h1>${esc(c.title)}</h1>${can(c.module, 'create') && !c.needsSource ? `<a class="btn primary" href="#/${key}/new">${icon('plus')}${esc(c.one)} جديد</a>` : ''}</div>
      ${c.needsSource ? `<p class="note" style="margin-bottom:16px">يُنشأ ${esc(c.one)} ${esc(c.needsSource)} — فيُنسخ أصنافها وتعدّل الكميات المرتجعة.</p>` : ''}
      <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-tab="${k}">${t} <span class="muted num">(${(sets[k] || docs).length})</span></button>`).join('')}</div>
      ${f.length ? `<div class="tbl-wrap"><table class="list-tbl"><thead><tr><th>الرقم</th><th>${c.side === 'supplier' ? 'المورد' : 'العميل'}</th><th>التاريخ</th><th class="amt">الإجمالي</th><th>الحالة</th></tr></thead><tbody>
        ${f.map(d => `<tr class="click" data-href="#/${key}/${esc(d.id)}"><td><a class="rowlink num" href="#/${key}/${esc(d.id)}">${esc(d.number || 'مسودة')}</a></td><td class="m-sub" style="white-space:normal">${esc(d.party_name)}</td>
          <td class="num m-hide">${esc(d.issue_date)}</td><td class="amt num">${d.status === 'draft' ? '—' : money(d.total)}</td>
          <td>${d.status === 'posted' && !c.issue && d.kind === 'purchase_bill' ? badge(PAY[d.payment_status]) : statusBadge(d)}</td></tr>`).join('')}</tbody></table></div>`
      : empty('file', docs.length ? 'لا شيء هنا' : `لا توجد ${c.title} بعد`, docs.length ? 'جرّب تبويباً آخر.' : (c.needsSource ? `يُنشأ ${c.one} ${c.needsSource}.` : `أنشئ أول ${c.one}.`),
          !docs.length && can(c.module, 'create') && !c.needsSource ? `<a class="btn primary" href="#/${key}/new">${icon('plus')}${esc(c.one)} جديد</a>` : '')}`;
    $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; sessionStorage.setItem('tab-' + key, tab); render(); });
  };
  render();
}

  const totals = () => { let s = 0, v = 0; lines.forEach((l, i) => { const k = lineCalc(l); const ok = Number.isFinite(k.net); s += ok ? k.net : 0; v += ok ? k.vat : 0;
      const cell = $(`tr[data-i="${i}"] [data-total]`); if (cell) cell.textContent = ok ? money(k.net + k.vat) : '—'; });
    $('#tSub').textContent = money(s); $('#tVat').textContent = money(v); $('#tTot').textContent = money(s + v) + ' ر.س'; };
  $('#lines').addEventListener('input', e => { const tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k) return; const l = lines[tr.dataset.i];
    if (k === 'qty') l.qty = num(e.target.value); else if (k === 'unit_price' || k === 'discount') l[k] = toHalalas(e.target.value || 0); else if (k === 'description') l.description = e.target.value; totals(); });
  $('#lines').addEventListener('change', e => { const tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr) return; const l = lines[tr.dataset.i];
    if (k === 'item_id') { l.item_id = e.target.value; const it = itemById[l.item_id];
      if (it) { l.description = it.name_ar; l.unit_price = Math.round(Number(it[c.price]) || 0); l.tax_category = it.tax_category; l.vat_rate = it.tax_category === 'S' ? 15 : 0; if (it.track_stock) l.account_id = ''; } drawLines(); }
    if (k === 'account_id') l.account_id = e.target.value;
    if (k === 'tax_category') { l.tax_category = e.target.value; l.vat_rate = l.tax_category === 'S' ? 15 : 0; totals(); } });
  $('#lines').addEventListener('click', e => { if (e.target.closest('[data-del]')) { lines.splice(e.target.closest('tr').dataset.i, 1); if (!lines.length) lines.push(blank()); drawLines(); } });
  $('#addl').onclick = () => { lines.push(blank()); drawLines(); $(`tr[data-i="${lines.length - 1}"] select`).focus(); };
  if ($('#lcs')) { $('#addlc').onclick = () => { lc.push({ description: '', amount: 0 }); drawLc(); };
    $('#lcs').addEventListener('input', e => { const r = e.target.closest('[data-c]'); if (!r) return; const x = lc[r.dataset.c]; if (e.target.dataset.ck === 'amount') x.amount = toHalalas(e.target.value || 0); else x.description = e.target.value; });
    $('#lcs').addEventListener('click', e => { if (e.target.closest('[data-cdel]')) { lc.splice(e.target.closest('[data-c]').dataset.c, 1); drawLc(); } }); }
  if ($('#paynow')) $('#paynow').onchange = e => $('#payw').hidden = !e.target.checked;
  if ($('#qparty')) $('#qparty').onclick = e => { e.preventDefault(); partyDrawer(null, async p => { toast('تمت الإضافة'); parties.push(p); $('#f-party').innerHTML = optList(parties.map(x => [x.id, x.name]), p.id, c.side === 'supplier' ? '— اختر المورد —' : '— عميل نقدي —'); }, c.side); };
  const validate = () => { const err = []; if (!$('#f-issue_date').value) err.push('التاريخ مطلوب');
    if (c.side === 'supplier' && !$('#f-party').value) err.push('اختر المورد');
    const real = lines.filter(l => l.description?.trim() || l.item_id);
    if (!real.length) err.push('أضف سطراً واحداً على الأقل');
    real.forEach((l, i) => { if (!l.description?.trim()) err.push(`السطر ${i + 1}: الوصف مطلوب`); if (!(l.qty > 0)) err.push(`السطر ${i + 1}: الكمية يجب أن تكون أكبر من صفر`);
      if (!Number.isFinite(l.unit_price) || l.unit_price < 0) err.push(`السطر ${i + 1}: السعر غير صحيح`); if (!Number.isFinite(l.discount) || l.discount < 0 || l.discount > Math.round(l.qty * l.unit_price)) err.push(`السطر ${i + 1}: الخصم غير صحيح`); });
    lc.forEach((x, i) => { if (!(x.amount > 0) || !x.description.trim()) err.push(`تكلفة الشحن ${i + 1}: الوصف والمبلغ مطلوبان`); });
    return { err, real }; };
  const save = async mode => { const { err, real } = validate(); $('#ierr').textContent = err.join(' · '); if (err.length) return;
    const btns = $$('#docf button'); btns.forEach(b => b.disabled = true);
    try {
      const f = Object.fromEntries(new FormData($('#docf')));
      const d = { ...(existing ? { id: existing.id } : {}), kind: f.kind || c.kinds[0][0], party_id: existing?.source ? existing.party_id : (f.party_id || null), issue_date: f.issue_date,
        issue_time: riyadhTime(), due_date: f.due_date || null, note: f.note, warehouse_id: f.warehouse_id || null, branch_id: existing?.branch_id || null, related_document_id: existing?.related_document_id || null, cost_center_id: f.cost_center_id || null };
      const newId = await api.saveDraft(d, real.map(l => ({ ...l, item_id: l.item_id || null, account_id: itemById[l.item_id]?.track_stock ? null : (l.account_id || null), discount: l.discount || 0 })));
      if (c.landed) await api.saveLanded(newId, lc.filter(x => x.amount > 0));
      if (mode === 'submit') { await api.submitForApproval('documents', newId); toast('أُرسل للاعتماد'); }
      else if (mode === 'post') { await api.postDocument(d.kind, newId); toast(c.issue ? 'تم الإصدار' : 'تم الترحيل وتسجيل القيد');
        if (c.payNow && f.paynow) { const posted = await api.getDocument(newId);
          await api.createReceipt({ kind: 'payment', party_id: posted.party_id, pay_date: posted.issue_date, amount: posted.total, method: 'bank_transfer', cash_account_id: f.pay_account, reference: 'سداد ' + posted.number, allocations: [{ document_id: newId, amount: posted.total }] });
          toast('أُنشئ سند الصرف'); } }
      else toast('تم حفظ المسودة');
      location.hash = '#/' + key + '/' + newId + (mode === 'draft' ? '/edit' : '');
      if (mode === 'draft' && existing) docEditView(key, newId);
    } catch (x) { fail(x); $('#ierr').textContent = x.message; btns.forEach(b => b.disabled = false); } };
  $('#docf').addEventListener('submit', e => { e.preventDefault(); save('post'); });
  $('#saved').onclick = () => save('draft');
  if ($('#submitd')) $('#submitd').onclick = () => save('submit');
  if (existing) $('#deld').onclick = async e => { if (!confirmBtn(e.target)) return; await api.deleteDraft(existing.id); toast('حُذفت المسودة'); location.hash = '#/' + key; };
  drawLines(); drawLc();
}

async function docView(key, id) {
  const c = DOCS[key]; shell(key, loading());
  const d = await api.getDocument(id);
  if (d.status === 'draft' && can(c.module, 'create')) { location.hash = '#/' + key + '/' + id + '/edit'; return; }
  let qrSvg = '';
  if (c.qr && d.status === 'posted') { try { const ts = `${d.issue_date}T${(d.issue_time || '00:00:00').slice(0, 8)}+03:00`;
    qrSvg = QR.svg(QR.encode(QR.ascii(QR.zatcaTLV({ seller: ORG.name_ar, vatNo: ORG.vat_number || '', timestamp: new Date(ts).toISOString().replace('.000', ''), total: (d.total / 100).toFixed(2), vat: (d.vat_total / 100).toFixed(2) }))), 3); } catch { qrSvg = ''; } }
  const open = d.total - d.amount_paid, actions = [];
  if (d.status === 'posted' && c.convert && can(DOCS[KIND_ROUTE[c.convert[0][0]]]?.module || 'sales', 'create'))
    c.convert.forEach(([t, label]) => actions.push(`<button class="btn primary" data-conv="${t}">${esc(label)}</button>`));
  if (d.status === 'posted' && d.kind === 'purchase_bill') {
    if (open > 0 && can('purchases', 'create')) actions.push(`<a class="btn primary" href="#/payments/new?party=${esc(d.party_id)}&doc=${esc(d.id)}">${icon('receipt')}سند صرف</a>`);
    if (can('purchases', 'create')) actions.push(`<button class="btn secondary" data-conv="purchase_return">إرجاع للمورد</button>`); }
  if (d.status === 'draft' && d.submitted_at && can(c.module, 'post')) actions.push(`<button class="btn primary" id="approve">اعتماد وترحيل</button>`);
  $('#main').innerHTML = `<a class="crumb no-print" href="#/${key}">${icon('chev')} ${esc(c.title)}</a>
    <div class="page-head no-print"><h1><span class="num">${esc(d.number || 'مسودة')}</span></h1>${d.kind === 'purchase_bill' && d.status === 'posted' ? badge(PAY[d.payment_status]) : statusBadge(d)}
      <button class="btn secondary" onclick="window.print()">${icon('down')}طباعة / PDF</button>${actions.join('')}</div>
    ${d.source ? `<p class="note no-print" style="margin-bottom:16px">مرتبط بـ <a href="${docLink(d.source)}">${esc(KIND_NAME[d.source.kind])} <span class="num">${esc(d.source.number)}</span></a></p>` : ''}
    ${docPaper(d, c.paper, qrSvg)}
    <div class="grid g2 no-print" style="margin-top:24px">${journalCard(d)}${relatedCard(d)}
      ${d.kind === 'purchase_bill' ? `<section class="card"><h3 style="margin-bottom:8px">السداد</h3>${d.payments.length ? `<div class="tbl-wrap"><table><thead><tr><th>السند</th><th>التاريخ</th><th class="amt">المبلغ</th></tr></thead><tbody>
        ${d.payments.map(a => `<tr><td class="num">${esc(a.payment?.number)}</td><td class="num">${esc(a.payment?.pay_date)}</td><td class="amt num">${money(a.amount)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">لم يُسجَّل سداد بعد.</p>'}</section>` : ''}</div>`;
  $$('[data-conv]').forEach(b => b.onclick = async () => { b.disabled = true;
    try { const nid = await api.convertDocument(d.id, b.dataset.conv); toast('أُنشئت مسودة — راجعها ثم رحّلها'); location.hash = '#/' + KIND_ROUTE[b.dataset.conv] + '/' + nid + '/edit'; } catch (x) { fail(x); b.disabled = false; } });
  if ($('#approve')) $('#approve').onclick = async e => { e.target.disabled = true; try { await api.postDocument(d.kind, d.id); toast('تم الاعتماد والترحيل'); docView(key, id); } catch (x) { fail(x); e.target.disabled = false; } };
}
const docRoutes = key => [

  const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);

async function bsReport(from, to, head) {
  const rows = await api.accountBalances(to, to);
  const byId = Object.fromEntries(rows.map(r => [r.account_id, r]));
  const top = r => { let x = r, g = groupCode(rows, r); while (g && g.parent_id && byId[g.parent_id]) { x = g; g = byId[g.parent_id]; } return g ? x : r; };
  const sec2 = r => { const g = byId[r.parent_id]; return g?.code?.length === 2 ? g : byId[g?.parent_id]?.code?.length === 2 ? byId[g.parent_id] : g; };
  const post = rows.filter(r => r.is_postable && r.closing);
  const block = (type, sign) => { const items = post.filter(r => r.type === type); const groups = {};
    items.forEach(r => { const g = sec2(r); const k = g?.id ? g.account_id : 'x'; (groups[k] ||= { name: g?.name_ar || '', code: g?.code || '', rows: [] }).rows.push({ ...r, v: sign * r.closing }); });
    return Object.values(groups).sort((a, b) => a.code.localeCompare(b.code)); };
  const earnings = -rows.filter(r => r.is_postable && ['revenue', 'expense'].includes(r.type)).reduce((a, r) => a + r.closing, 0);
  const A = block('asset', 1), L = block('liability', -1), E = block('equity', -1);
  const tA = A.reduce((s, g) => s + g.rows.reduce((t, r) => t + r.v, 0), 0), tL = L.reduce((s, g) => s + g.rows.reduce((t, r) => t + r.v, 0), 0), tE = E.reduce((s, g) => s + g.rows.reduce((t, r) => t + r.v, 0), 0) + earnings;
  const grp = g => `<tr class="sec"><td colspan="2">${esc(g.name)}</td></tr>${g.rows.sort((a, b) => a.code.localeCompare(b.code)).map(r => `<tr><td><span class="num muted">${esc(r.code)}</span> ${esc(r.name_ar)}</td><td class="amt num ${r.v < 0 ? 'down' : ''}">${money(r.v)}</td></tr>`).join('')}

function barChart(data) {   // data: [{label, a, b}] — a = revenue, b = expenses (+cogs)
  const W = 640, H = 220, pl = 8, pr = 56, pt = 12, pb = 28, max = Math.max(1, ...data.flatMap(d => [d.a, d.b]));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const cw = (W - pl - pr) / data.length, bw = Math.min(22, cw / 3), y = v => pt + (H - pt - pb) * (1 - v / nice);
  const ticks = [0, .5, 1].map(f => nice * f);
  const bar = (x, v, cls, lbl) => { const h = Math.max(0, y(0) - y(v)); if (h < .5) return '';
    const r = Math.min(4, bw / 2, h); const yy = y(v);
    return `<path class="${cls}" d="M${x},${y(0)} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${y(0)} Z"><title>${esc(lbl)}</title></path>`; };
  // RTL reading order: newest month on the left edge? keep chronological right→left like the page
  const xs = i => W - pr - cw * (i + 1) + (cw - bw * 2 - 2) / 2;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="الإيرادات والمصروفات آخر ${data.length} أشهر">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${W - pr + 6}" y="${y(t) + 4}" class="tick">${Math.round(t / 100).toLocaleString('en-US')}</text>`).join('')}
    ${data.map((d, i) => `<g class="hov">${bar(xs(i), d.a, 's1', `${d.label}: الإيرادات ${money(d.a)}`)}${bar(xs(i) + bw + 2, d.b, 's2', `${d.label}: المصروفات ${money(d.b)}`)}
      <text x="${xs(i) + bw + 1}" y="${H - 8}" class="tick" text-anchor="middle">${esc(d.label.split(' ')[0])}</text></g>`).join('')}</svg>`;
}

// ---------- ratios, KPIs, Altman Z'', zakat base ----------
async function kpiReport(_f, to, head) {

  const CA = sumBy(r => r.type === 'asset' && G(r) === '11'), FA = sumBy(r => r.type === 'asset' && G(r) !== '11'), TA = CA + FA;
  const CL = sumBy(r => r.type === 'liability' && G(r) === '21', -1), LL = sumBy(r => r.type === 'liability' && G(r) !== '21', -1), TL = CL + LL;
  const earnAll = -post.filter(r => ['revenue', 'expense'].includes(r.type)).reduce((s, r) => s + r.closing, 0);
  const EQ = sumBy(r => r.type === 'equity', -1) + earnAll, RE = sumBy(r => r.system_key === 'retained_earnings', -1) + earnAll;
  const cash = sumBy(r => ['cash', 'bank', 'card_clearing'].includes(r.system_key)), inv = sumBy(r => ['inventory', 'raw_materials', 'wip'].includes(r.system_key));
  const yp = yr.filter(r => r.is_postable), Y = Object.fromEntries(bal.map(r => [r.account_id, r])), cogsIds = new Set(yp.filter(r => topGroup(Y, r) === '51').map(r => r.account_id));
  const REV = yp.filter(r => r.type === 'revenue').reduce((s, r) => s + r.credit - r.debit, 0), COGS = yp.filter(r => cogsIds.has(r.account_id)).reduce((s, r) => s + r.debit - r.credit, 0);

// ---------- chart of accounts: add / edit, ledger link ----------
function accountDrawer(accs, a) {
  const groups = accs.filter(x => !x.is_postable);
  const sib = pid => accs.filter(x => x.parent_id === pid).map(x => Number(x.code)).filter(Number.isFinite);
  const nextCode = pid => { const p = accs.find(x => x.id === pid); const s = sib(pid); return s.length ? String(Math.max(...s) + 1) : (p ? p.code + '01' : ''); };
  const f = drawer(a ? 'تعديل حساب' : 'حساب جديد', `
    ${a ? '' : `<div class="field"><label for="f-parent_id">تحت الحساب الرئيسي</label><select class="input" id="f-parent_id" name="parent_id">${optList(groups.map(g => [g.id, `${g.code} — ${g.name_ar}`]), groups.find(g => g.code === '52')?.id)}</select></div>`}
    ${field('code', 'رمز الحساب', { req: true, value: a?.code || '', attrs: 'dir="ltr" inputmode="numeric" maxlength="12"' })}
    ${field('name_ar', 'اسم الحساب', { req: true, value: a?.name_ar || '', help: 'مثل: مصاريف الدعاية، بنك الراجحي، سيارة النقل' })}
    ${a ? '' : `<label class="row" style="gap:8px"><input type="checkbox" name="group"> حساب رئيسي (تجميعي) تُضاف تحته حسابات</label>`}
    ${a && !a.system_key ? '<button type="button" class="btn ghost" id="dela" style="color:var(--c-danger)">حذف الحساب</button>' : ''}`,
    async v => { if (!v.code?.trim() || !v.name_ar?.trim()) throw new AppError('الرمز والاسم مطلوبان');
      if (accs.some(x => x.code === v.code.trim() && x.id !== a?.id)) throw new AppError('هذا الرمز مستخدم');
      await api.saveAccount({ id: a?.id, parent_id: v.parent_id, code: v.code.trim(), name_ar: v.name_ar.trim(), type: accs.find(x => x.id === v.parent_id)?.type, is_postable: !v.group });
      toast('حُفظ الحساب'); accountsView(); });
  if (!a) { const sel = $('#f-parent_id', f), code = $('#f-code', f); code.value = nextCode(sel.value); sel.onchange = () => code.value = nextCode(sel.value); }
  if ($('#dela', f)) $('#dela', f).onclick = async e => { if (!confirmBtn(e.target)) return; try { await api.deleteAccount(a.id); f.closest('.drawer-bg').remove(); toast('حُذف'); accountsView(); } catch (x) { toast(x.message, 'bad'); } };
}
function enhanceAccounts(accs) {
  if (api.mode !== 'supabase') return;
  const head = $('#main .page-head');
  if (head && can('accounting', 'create')) { const b = document.createElement('button'); b.className = 'btn primary'; b.innerHTML = icon('plus') + 'حساب جديد'; b.onclick = () => accountDrawer(accs); head.append(b);
    const o = document.createElement('a'); o.className = 'btn secondary'; o.href = '#/opening'; o.textContent = 'الأرصدة الافتتاحية'; head.append(o); }
  $$('#main .tree-tbl tbody tr').forEach((tr, i) => { const a = accs.sorted?.[i]; if (!a) return;
    const td = tr.children[0]; if (a.is_postable) td.innerHTML = `<a href="#/ledger/${esc(a.id)}">${td.innerHTML}</a>`;
    if (can('accounting', 'create')) { const e = document.createElement('td'); e.innerHTML = `<button class="btn ghost sm" data-ea="${esc(a.id)}">تعديل</button>`; tr.append(e); } });
  const th = $('#main .tree-tbl thead tr'); if (th && can('accounting', 'create')) th.insertAdjacentHTML('beforeend', '<th></th>');
  $$('[data-ea]').forEach(b => b.onclick = () => accountDrawer(accs, accs.find(x => x.id === b.dataset.ea)));
}

// ---------- ledger (account statement) ----------
async function ledgerView(id, qs) {
  shell('accounts', loading());
  const [accs, parties] = await Promise.all([api.listAccounts(), api.listParties()]);
  const a = accs.find(x => x.id === id); if (!a) throw new AppError('الحساب غير موجود');
  const y = riyadhToday().slice(0, 4), from = qs?.get('from') || `${y}-01-01`, to = qs?.get('to') || riyadhToday(), party = qs?.get('party') || '';
  const rows = await api.accountStatement(id, from, to, party);
  const SRC = { manual: 'قيد يدوي', document: 'مستند', payment: 'سند', expense: 'مصروف', stock: 'مخزون', reversal: 'عكس', opening: 'افتتاحي', payroll: 'رواتب', depreciation: 'إهلاك', custody: 'عهدة', card_settlement: 'تسوية شبكة' };
  const sign = ['asset', 'expense'].includes(a.type) ? 1 : -1, last = rows.at(-1)?.balance || 0;
  const D = rows.reduce((s, r) => s + r.debit, 0), C = rows.reduce((s, r) => s + r.credit, 0);
  $('#main').innerHTML = `<a class="crumb no-print" href="#/accounts">${icon('chev')} شجرة الحسابات</a>
    <div class="page-head no-print"><h1>كشف حساب: ${esc(a.name_ar)} <span class="num muted" style="font-size:var(--fs-md)">${esc(a.code)}</span></h1>
      <button class="btn secondary" id="csvl">${icon('down')}Excel (CSV)</button><button class="btn secondary" onclick="window.print()">${icon('down')}طباعة</button></div>
    <form class="row no-print" id="lf" style="flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:flex-end">
      <div class="field" style="margin:0"><label for="f-acc">الحساب</label><select class="input" id="f-acc" style="height:38px">${optList(accs.filter(x => x.is_postable).map(x => [x.id, `${x.code} — ${x.name_ar}`]), id)}</select></div>
      <div class="field" style="margin:0"><label for="f-from">من</label><input class="input" type="date" id="f-from" value="${esc(from)}" style="height:38px"></div>
      <div class="field" style="margin:0"><label for="f-to">إلى</label><input class="input" type="date" id="f-to" value="${esc(to)}" style="height:38px"></div>
      <div class="field" style="margin:0"><label for="f-pt">الطرف</label><select class="input" id="f-pt" style="height:38px">${optList(parties.map(p => [p.id, p.name]), party, '— الكل —')}</select></div>
      <button class="btn primary" type="submit">عرض</button></form>
    <section class="card"><div class="rep-head"><b>${esc(ORG.name_ar)}</b><h2 style="margin:4px 0">كشف حساب ${esc(a.code)} — ${esc(a.name_ar)}</h2><p class="muted" style="margin:0 0 12px">من <span class="num">${from}</span> إلى <span class="num">${to}</span>${party ? ' — ' + esc(parties.find(p => p.id === party)?.name || '') : ''}</p></div>
    <div class="grid g4" style="margin-bottom:12px">${[['الرصيد الافتتاحي', (rows[0]?.balance || 0) * sign], ['إجمالي المدين', D], ['إجمالي الدائن', C], ['الرصيد الختامي', last * sign]].map(([t, v]) => `<div class="stat"><div class="label">${t}</div><div class="val num ${v < 0 ? 'down' : ''}">${money(v)}</div></div>`).join('')}</div>
    <div class="tbl-wrap"><table class="rep-tbl" id="ledt"><thead><tr><th>التاريخ</th><th>رقم القيد</th><th>البيان</th><th class="m-hide">النوع</th><th class="m-hide">الطرف</th><th class="amt">مدين</th><th class="amt">دائن</th><th class="amt">الرصيد</th></tr></thead><tbody>
      ${rows.map(r => `<tr${r.source_type === 'opening' ? ' class="sec"' : ''}><td class="num">${esc(r.entry_date)}</td><td class="num">${r.entry_id ? `<a href="#/journal/${esc(r.entry_id)}">${esc(r.entry_no)}</a>` : ''}</td><td style="white-space:normal">${esc(r.memo || '')}</td>
        <td class="m-hide">${esc(SRC[r.source_type] || '')}</td><td class="m-hide">${esc(r.party_name || '')}</td><td class="amt num">${r.debit ? money(r.debit) : ''}</td><td class="amt num">${r.credit ? money(r.credit) : ''}</td><td class="amt num">${money(r.balance * sign)}</td></tr>`).join('')}
      <tr class="grand"><td colspan="5">الإجمالي</td><td class="amt num">${money(D)}</td><td class="amt num">${money(C)}</td><td class="amt num">${money(last * sign)}</td></tr></tbody></table></div></section>`;
  const go = () => { const q = new URLSearchParams({ from: $('#f-from').value, to: $('#f-to').value }); if ($('#f-pt').value) q.set('party', $('#f-pt').value); location.hash = `#/ledger/${$('#f-acc').value}?${q}`; };
  $('#lf').onsubmit = e => { e.preventDefault(); go(); }; $('#f-acc').onchange = go;
  $('#csvl').onclick = () => dl([['التاريخ', 'القيد', 'البيان', 'الطرف', 'مدين', 'دائن', 'الرصيد'], ...rows.map(r => [r.entry_date, r.entry_no || '', r.memo || '', r.party_name || '', (r.debit / 100).toFixed(2), (r.credit / 100).toFixed(2), (r.balance * sign / 100).toFixed(2)])], `كشف ${a.code} ${from}_${to}`);
}

// ---------- opening balances ----------
async function openingView() {
  shell('accounts', loading());
  if (!can('accounting', 'post')) { location.hash = '#/accounts'; return; }
  const [accs, ps] = await Promise.all([api.listAccounts(), api.listParties()]);
  const list = accs.filter(a => a.is_postable && ['asset', 'liability', 'equity'].includes(a.type) && !['inventory', 'raw_materials', 'opening_balance', 'retained_earnings', 'acc_depreciation'].includes(a.system_key) && !/^16/.test(a.code));
  const needsParty = a => ['ar', 'ap', 'custody', 'supplier_advances', 'customer_advances'].includes(a.system_key);
  let rows = list.filter(a => !needsParty(a)).map(a => ({ account_id: a.id, party_id: '', amount: 0 }));
  $('#main').innerHTML = `<a class="crumb" href="#/accounts">${icon('chev')} شجرة الحسابات</a><div class="page-head"><h1>الأرصدة الافتتاحية</h1></div>
    <p class="note" style="margin-bottom:16px">أدخل أرصدة الحسابات يوم بدء استخدام النظام. المخزون يُدخل من «حركات المخزون ← رصيد افتتاحي»، والأصول الثابتة من صفحة «الأصول الثابتة». الفرق يُرحَّل تلقائياً لحساب «الأرصدة الافتتاحية» في حقوق الملكية.</p>
    <form class="card" id="obf" novalidate><div class="grid g3" style="margin-bottom:12px">${field('date', 'تاريخ الأرصدة', { type: 'date', value: `${riyadhToday().slice(0, 4)}-01-01`, req: true })}</div>
      <div class="tbl-wrap editor"><table><thead><tr><th>الحساب</th><th>الطرف (للعملاء والموردين والعهد)</th><th style="width:170px">الرصيد</th><th style="width:44px"></th></tr></thead><tbody id="obl"></tbody></table></div>
      <button type="button" class="btn ghost sm" id="obadd" style="margin-top:8px">${icon('plus')}رصيد عميل / مورد / عهدة</button>
      <div class="totals"><div><span class="muted">مجموع الأصول (مدين)</span><span class="num" id="obD"></span></div><div><span class="muted">مجموع الخصوم وحقوق الملكية (دائن)</span><span class="num" id="obC"></span></div><div class="grand"><span>يُرحّل للأرصدة الافتتاحية</span><span class="num" id="obX"></span></div></div>
      <p class="help err" id="oberr" role="alert"></p><div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit">ترحيل الأرصدة الافتتاحية</button></div></form>`;
  const A = Object.fromEntries(accs.map(a => [a.id, a]));
  const draw = () => { $('#obl').innerHTML = rows.map((r, i) => { const a = A[r.account_id];
    return `<tr data-i="${i}"><td>${r.extra ? `<select class="input" data-k="account_id" aria-label="الحساب">${optList(list.filter(needsParty).map(x => [x.id, `${x.code} — ${x.name_ar}`]), r.account_id)}</select>` : `<span class="num muted">${esc(a.code)}</span> ${esc(a.name_ar)}`}</td>
      <td>${r.extra || needsParty(a) ? `<select class="input" data-k="party_id" aria-label="الطرف">${optList(ps.map(p => [p.id, p.name]), r.party_id, '— اختر —')}</select>` : '<span class="muted">—</span>'}</td>
      <td><input class="input num" data-k="amount" inputmode="decimal" value="${r.amount ? money(r.amount) : ''}" placeholder="0.00" aria-label="الرصيد"></td><td>${r.extra ? `<button type="button" class="btn ghost icon sm" data-del aria-label="حذف">${icon('trash')}</button>` : ''}</td></tr>`; }).join(''); sum(); };
  const sum = () => { let d = 0, c = 0; rows.forEach(r => { const a = A[r.account_id]; if (!a || !(r.amount > 0)) return; if (a.type === 'asset') d += r.amount; else c += r.amount; });
    $('#obD').textContent = money(d); $('#obC').textContent = money(c); $('#obX').textContent = money(d - c); };
  $('#obl').addEventListener('input', e => { const tr = e.target.closest('tr'); if (tr && e.target.dataset.k === 'amount') { const v = toHalalas(e.target.value || 0); rows[tr.dataset.i].amount = Number.isFinite(v) ? v : NaN; sum(); } });
  $('#obl').addEventListener('change', e => { const tr = e.target.closest('tr'); if (tr && e.target.tagName === 'SELECT') { rows[tr.dataset.i][e.target.dataset.k] = e.target.value; sum(); } });
  $('#obl').addEventListener('click', e => { if (e.target.closest('[data-del]')) { rows.splice(e.target.closest('tr').dataset.i, 1); draw(); } });
  $('#obadd').onclick = () => { rows.push({ account_id: list.find(a => a.system_key === 'ar')?.id, party_id: '', amount: 0, extra: true }); draw(); };
  $('#obf').onsubmit = async e => { e.preventDefault(); const err = $('#oberr'); err.textContent = '';
    if (rows.some(r => !Number.isFinite(r.amount) || r.amount < 0)) return err.textContent = 'مبلغ غير صحيح';
    const real = rows.filter(r => r.amount > 0); if (!real.length) return err.textContent = 'أدخل رصيداً واحداً على الأقل';
    if (real.some(r => needsParty(A[r.account_id]) && !r.party_id)) return err.textContent = 'اختر الطرف لأرصدة العملاء والموردين والعهد';
    const lines = real.map(r => { const a = A[r.account_id]; return a.type === 'asset' ? { account_id: a.id, debit: r.amount, credit: 0, party_id: r.party_id || null } : { account_id: a.id, debit: 0, credit: r.amount, party_id: r.party_id || null }; });
    const d = lines.reduce((s, l) => s + l.debit, 0), c = lines.reduce((s, l) => s + l.credit, 0), ob = accs.find(a => a.system_key === 'opening_balance');
    if (d !== c) lines.push(d > c ? { account_id: ob.id, debit: 0, credit: d - c } : { account_id: ob.id, debit: c - d, credit: 0 });
    $('[type=submit]', e.target).disabled = true;
    try { const id = await api.postManualEntry($('#f-date').value, 'أرصدة افتتاحية', lines); toast('رُحّلت الأرصدة الافتتاحية'); location.hash = '#/journal/' + id; }
    catch (x) { err.textContent = x.message; $('[type=submit]', e.target).disabled = false; } };
  draw();
}

// ---------- fixed assets ----------
async function assetsView() {
  shell('assets', loading()); const [as, accs, ccs] = await Promise.all([api.listAssets(), api.listAccounts(), api.listCostCenters()]);
  const act = as.filter(a => a.status === 'active'), editable = can('accounting', 'create'), canPost = can('accounting', 'post');
  const T = k => act.reduce((s, a) => s + (k === 'book' ? a.cost - a.depreciated : a[k]), 0);
  $('#main').innerHTML = `<div class="page-head"><h1>الأصول الثابتة</h1>${canPost ? `<button class="btn secondary" id="rundep">احتساب الإهلاك حتى هذا الشهر</button>` : ''}${editable ? `<button class="btn primary" id="newfa">${icon('plus')}أصل جديد</button>` : ''}</div>
    <p class="muted" style="margin:-8px 0 16px">المكائن، المعدات، السيارات، الأثاث… يُحسب الإهلاك الشهري بالقسط الثابت ويُسجَّل قيده تلقائياً.</p>
    <div class="grid g3" style="margin-bottom:20px">${[['تكلفة الأصول', T('cost')], ['مجمع الإهلاك', T('depreciated')], ['القيمة الدفترية', T('book')]].map(([t, v]) => `<div class="card stat"><div class="label">${t}</div><div class="val num">${money(v)}</div></div>`).join('')}</div>
    ${as.length ? `<div class="tbl-wrap"><table class="list-tbl"><thead><tr><th>الرمز</th><th>الأصل</th><th class="m-hide">الفئة</th><th class="num m-hide">الشراء</th><th class="amt">التكلفة</th><th class="amt m-hide">الإهلاك الشهري</th><th class="amt">المجمع</th><th class="amt">الدفترية</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${as.map(a => `<tr><td class="num">${esc(a.code)}</td><td style="white-space:normal"><b>${esc(a.name)}</b><div class="xs muted">${a.life_months} شهراً${a.last_month ? ' · آخر إهلاك ' + esc(a.last_month.slice(0, 7)) : ''}</div></td><td class="m-hide">${esc(a.accounts?.name_ar || '')}</td>
        <td class="num m-hide">${esc(a.acquisition_date)}</td><td class="amt num">${money(a.cost)}</td><td class="amt num m-hide">${money(Math.round((a.cost - a.salvage) / a.life_months))}</td><td class="amt num">${money(a.depreciated)}</td><td class="amt num"><b>${money(a.cost - a.depreciated)}</b></td>
        <td>${a.status === 'active' ? badge(['قيد الاستخدام', 'b-ok']) : badge(['مستبعد', 'b-draft'])}</td>
        <td>${a.status === 'active' ? `${editable ? `<button class="btn ghost sm" data-ed="${esc(a.id)}">تعديل</button>` : ''}${canPost ? `<button class="btn ghost sm" data-dis="${esc(a.id)}">بيع / استبعاد</button>` : ''}` : ''}</td></tr>`).join('')}</tbody></table></div>`
    : empty('box', 'لا توجد أصول بعد', 'سجّل مكائن الورشة والسيارات والمعدات لتحسب إهلاكها شهرياً.', editable ? `<button class="btn primary" id="newfa2">${icon('plus')}أصل جديد</button>` : '')}`;
  const cats = accs.filter(a => a.is_postable && a.type === 'asset' && /^1[26]/.test(a.code) && a.system_key !== 'acc_depreciation' && !['ar', 'retention_receivable', 'custody', 'supplier_advances'].includes(a.system_key));
  const open = a => { a = a || { code: 'FA-' + String(as.length + 1).padStart(3, '0'), acquisition_date: riyadhToday(), depreciation_start: riyadhToday().slice(0, 8) + '01', life_months: 60, salvage: 0 };
    const locked = a.depreciated > 0;
    drawer(a.id ? 'تعديل أصل' : 'أصل ثابت جديد', `<div class="form-grid">${field('code', 'الرمز', { req: true, value: a.code, attrs: 'dir="ltr"' })}
        <div class="field"><label for="f-account_id">الفئة (حساب الأصل)</label><select class="input" id="f-account_id" name="account_id">${acctOpts(cats, a.account_id || cats[0]?.id)}</select></div></div>
      ${field('name', 'اسم الأصل', { req: true, value: a.name || '', help: 'مثل: ماكينة قص ليزر، شاحنة نقل، رافعة شوكية' })}
      <div class="form-grid">${field('acquisition_date', 'تاريخ الشراء', { type: 'date', value: a.acquisition_date, req: true })}${field('depreciation_start', 'بداية الإهلاك', { type: 'date', value: a.depreciation_start, req: true, attrs: locked ? 'disabled' : '' })}
        ${field('cost', 'التكلفة قبل الضريبة', { type: 'money', req: true, value: a.cost ? money(a.cost) : '', attrs: locked ? 'disabled' : '' })}${field('salvage', 'القيمة المتبقية (الخردة)', { type: 'money', value: a.salvage ? money(a.salvage) : '', attrs: locked ? 'disabled' : '' })}
        ${field('life_months', 'العمر الإنتاجي (بالأشهر)', { value: a.life_months, req: true, help: 'السيارات عادة 48–60، المكائن 60–120', attrs: `inputmode="numeric" ${locked ? 'disabled' : ''}` })}
        ${ccs.length ? `<div class="field"><label for="f-cost_center_id">مركز التكلفة</label><select class="input" id="f-cost_center_id" name="cost_center_id">${optList(ccs.map(c => [c.id, c.name]), a.cost_center_id, '— بدون —')}</select></div>` : ''}</div>
      ${field('notes', 'ملاحظات', { value: a.notes || '' })}
      ${!a.id ? '<p class="note">تسجيل الأصل لا يُنشئ قيد الشراء — سجّل الشراء بفاتورة مشتريات على حساب الأصل، أو كرصيد افتتاحي.</p>' : ''}${locked ? '<p class="note warn">عليه إهلاك مرحّل؛ لا تتغير التكلفة والعمر.</p>' : ''}`,
      async v => { const life = parseInt(toLatin(v.life_months ?? a.life_months), 10); const cost = v.cost != null ? toHalalas(v.cost) : a.cost, salvage = v.salvage != null ? toHalalas(v.salvage || 0) : a.salvage;
        if (!v.name?.trim()) throw new AppError('الاسم مطلوب'); if (!(cost > 0)) throw new AppError('أدخل التكلفة'); if (!(salvage >= 0) || salvage >= cost) throw new AppError('القيمة المتبقية أقل من التكلفة');
        if (!(life >= 1 && life <= 600)) throw new AppError('العمر الإنتاجي بين 1 و600 شهر');
        await api.saveAsset({ ...(a.id ? { id: a.id } : {}), code: v.code.trim(), name: v.name.trim(), account_id: v.account_id, acquisition_date: v.acquisition_date, notes: v.notes, cost_center_id: v.cost_center_id || null,
          ...(locked ? {} : { cost, salvage, life_months: life, depreciation_start: v.depreciation_start }) });
        toast('حُفظ الأصل'); assetsView(); }); };
  ['#newfa', '#newfa2'].forEach(s => { if ($(s)) $(s).onclick = () => open(null); });

function parseCSV(text) {

  const first = text.split(/\r?\n/)[0] || '', delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : first.includes('\t') && !first.includes(',') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;

    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true; else if (c === delim) { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
