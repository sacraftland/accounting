<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f2a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f6b3a%22/%3E%3Cpath d=%22M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E">
<title>دفتر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* generated from tokens.json — do not edit by hand */
:root{
  --c-bg: #f7f3ec;
  --c-surface: #fffdf9;
  --c-surface-2: #efe8dc;
  --c-border: #e2d8c8;
  --c-border-input: #8a7b66;
  --c-text: #2b241c;
  --c-text-muted: #6b5d4c;
  --c-accent: #4f6b3a;
  --c-accent-hover: #425a30;
  --c-accent-soft: #e6ecdc;
  --c-on-accent: #ffffff;
  --c-focus: #b0672b;
  --c-danger: #a8362a;
  --c-danger-soft: #f6e2dd;
  --c-success: #2f6b3f;
  --c-success-soft: #e1eedf;
  --c-warning: #8a5a00;
  --c-warning-soft: #f8ecd2;
  --c-info: #2d5f7a;
  --c-info-soft: #e0ecf2;
  --c-sidebar: #2f2a24;
  --c-on-sidebar: #f3ece0;
  --c-on-sidebar-muted: #c3b7a5;
  --font-sans: "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-xs: 12px; --lh-xs: 18px; --fw-xs: 500;
  --fs-sm: 14px; --lh-sm: 22px; --fw-sm: 400;
  --fs-base: 16px; --lh-base: 26px; --fw-base: 400;
  --fs-lg: 20px; --lh-lg: 30px; --fw-lg: 600;
  --fs-xl: 28px; --lh-xl: 38px; --fw-xl: 700;
  --fs-display: 40px; --lh-display: 52px; --fw-display: 700;
  --sp-0: 0px;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
  --sh-card: 0 1px 2px rgba(60,40,20,.06), 0 1px 3px rgba(60,40,20,.10);
  --sh-pop: 0 12px 32px rgba(60,40,20,.18);
  --t-fast: 120ms; --t-base: 200ms; --ease: cubic-bezier(.2,.8,.2,1);
  --l-sidebar: 264px;
  --l-header: 60px;
  --l-content-max: 1280px;
  --l-form-max: 880px;
  --l-touch-target: 44px;
  --l-table-row: 44px;
  --l-pos-key: 64px;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);font-size:var(--fs-sm);line-height:var(--lh-sm);background:var(--c-bg);color:var(--c-text);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums lining-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0}
h1{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:var(--fw-xl)}
h2{font-size:var(--fs-lg);line-height:var(--lh-lg);font-weight:var(--fw-lg)}
h3{font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600}
.muted{color:var(--c-text-muted)}
.xs{font-size:var(--fs-xs);line-height:var(--lh-xs)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flip{transform:scaleX(-1)} [dir=ltr] .flip{transform:none}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:var(--l-sidebar) 1fr;min-height:100vh}
.side{background:var(--c-sidebar);color:var(--c-on-sidebar);padding:var(--sp-5) var(--sp-4);position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--fs-lg);margin-bottom:var(--sp-6)}
.brand .mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--c-accent);display:grid;place-items:center;color:var(--c-on-accent)}
.nav-group{color:var(--c-on-sidebar-muted);font-size:var(--fs-xs);margin:var(--sp-5) var(--sp-3) var(--sp-2)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--c-on-sidebar);text-decoration:none;min-height:40px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);font-weight:600}
.main{min-width:0}
.top{height:var(--l-header);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-6);position:sticky;top:0;z-index:5}
.top .search{flex:1;max-width:420px}
.top .sp{flex:1}
.menu-btn{display:none}
.page{max-width:var(--l-content-max);margin:0 auto;padding:var(--sp-6)}
.section{margin-bottom:var(--sp-7)}
.section > h2{margin-bottom:var(--sp-2)}
.section > p.muted{margin:0 0 var(--sp-4)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--sh-card);padding:var(--sp-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center}
.grid{display:grid;gap:var(--sp-4)}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}

/* buttons */
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 var(--sp-4);border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;transition:background var(--t-fast) var(--ease),border-color var(--t-fast);white-space:nowrap}
.btn.sm{height:32px;padding:0 var(--sp-3);font-size:var(--fs-xs)} .btn.lg{height:48px;padding:0 var(--sp-5);font-size:var(--fs-base)}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)} .btn.primary:hover{background:var(--c-accent-hover)}
.btn.secondary{background:var(--c-surface);color:var(--c-text);border-color:var(--c-border-input)} .btn.secondary:hover{background:var(--c-surface-2)}
.btn.ghost{background:transparent;color:var(--c-text)} .btn.ghost:hover{background:var(--c-surface-2)}
.btn.danger{background:var(--c-danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.icon{width:40px;padding:0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:500}
.input{font:inherit;font-size:var(--fs-base);height:40px;padding:0 12px;border:1px solid var(--c-border-input);border-radius:var(--r-sm);background:var(--c-surface);color:var(--c-text);width:100%}
.input:hover{border-color:var(--c-text-muted)}
.input:focus{outline:2px solid var(--c-focus);outline-offset:0;border-color:var(--c-focus)}
.input[readonly]{background:var(--c-surface-2)}
.input.err{border-color:var(--c-danger)}
.help{font-size:var(--fs-xs);color:var(--c-text-muted)} .help.err{color:var(--c-danger)}
.affix{position:relative} .affix .input{padding-left:52px;padding-right:12px;text-align:right;direction:ltr}
.affix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--c-text-muted)}
.lead{position:relative} .lead .input{padding-inline-start:40px} .lead svg{position:absolute;inset-inline-start:12px;top:10px;color:var(--c-text-muted)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--c-text-muted) 50%),linear-gradient(135deg,var(--c-text-muted) 50%,transparent 50%);background-position:14px 18px,19px 18px;background-size:5px 5px;background-repeat:no-repeat}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.b-draft{background:var(--c-surface-2);color:var(--c-text-muted)}
.b-info{background:var(--c-info-soft);color:var(--c-info)}
.b-ok{background:var(--c-success-soft);color:var(--c-success)}
.b-warn{background:var(--c-warning-soft);color:var(--c-warning)}
.b-bad{background:var(--c-danger-soft);color:var(--c-danger)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* stat */
.stat .label{color:var(--c-text-muted)}
.stat .val{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:700;margin:4px 0}
.up{color:var(--c-success)} .down{color:var(--c-danger)}
.spark{width:100%;height:36px;margin-top:8px}

/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:0 var(--sp-4);height:var(--l-table-row);text-align:start;border-bottom:1px solid var(--c-border);white-space:nowrap}
th{background:var(--c-surface-2);font-weight:600;color:var(--c-text-muted);font-size:var(--fs-xs);position:sticky;top:0}
td.amt,th.amt{text-align:end}
tbody tr:hover{background:var(--c-bg)}
tfoot td{font-weight:700;background:var(--c-surface-2);border-bottom:0}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--c-surface-2),var(--c-border),var(--c-surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* editor */
.editor td{padding:4px 6px} .editor .input{height:36px;font-size:var(--fs-sm)}
.totals{width:320px;margin-inline-start:auto;margin-top:var(--sp-4)}
.totals div{display:flex;justify-content:space-between;padding:6px 0}
.totals .grand{border-top:2px solid var(--c-text);font-size:var(--fs-lg);font-weight:700;padding-top:10px;margin-top:4px}

/* tree */
.tree{list-style:none;margin:0;padding:0}
.tree li{display:flex;align-items:center;gap:8px;height:38px;padding-inline-start:calc(var(--d,0) * 22px)}
.tree .code{color:var(--c-text-muted);width:48px}
.tree .bal{margin-inline-start:auto}
.tree .grp{font-weight:700}

/* toast & modal */
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-md);box-shadow:var(--sh-pop);background:var(--c-surface);border-inline-start:4px solid;min-width:280px}
.toast.ok{border-color:var(--c-success)} .toast.bad{border-color:var(--c-danger)} .toast.warn{border-color:var(--c-warning)}
.modal-demo{position:relative;border-radius:var(--r-lg);background:rgba(43,36,28,.45);padding:var(--sp-6);display:grid;place-items:center}
.modal{background:var(--c-surface);border-radius:var(--r-lg);box-shadow:var(--sh-pop);width:min(440px,100%);padding:var(--sp-5)}
.modal footer{display:flex;gap:8px;justify-content:flex-end;margin-top:var(--sp-5)}

/* empty */
.empty{text-align:center;padding:var(--sp-7) var(--sp-4)}
.empty svg{width:40px;height:40px;color:var(--c-text-muted);stroke-width:1.5}

/* stepper */
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0}
.steps li{flex:1;display:flex;align-items:center;gap:8px;color:var(--c-text-muted)}
.steps li:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--c-border);margin:0 8px}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c-border);font-weight:700;background:var(--c-surface)}
.steps .done .n{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
.steps .done{color:var(--c-text)} .steps .done:not(:last-child)::after{background:var(--c-accent)}
.steps .cur .n{border-color:var(--c-accent);color:var(--c-accent)} .steps .cur{color:var(--c-text);font-weight:600}

/* POS */
.pos{display:grid;grid-template-columns:1fr 340px;gap:var(--sp-4)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{min-height:var(--l-pos-key);border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface);padding:10px;text-align:start;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile:hover{border-color:var(--c-accent);background:var(--c-accent-soft)}
.cart{display:flex;flex-direction:column;gap:8px}
.cart .line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--c-border)}
.offline{background:var(--c-warning-soft);color:var(--c-warning);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;display:flex;gap:8px;align-items:center}

/* print preview */
.paper{background:#fff;color:#000;border:1px solid var(--c-border);box-shadow:var(--sh-card);padding:28px;max-width:720px;margin:auto;font-size:13px}
.paper table th{background:#f2f2f2;color:#000;position:static}
.paper th,.paper td{height:32px;padding:0 8px;border-bottom:1px solid #ddd}
.paper .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:12px}
.paper .qr{width:110px;height:110px;display:grid;grid-template-columns:repeat(11,1fr)}
.paper .qr i{background:#000}

/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw div{border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;background:var(--c-surface);font-size:var(--fs-xs)}
.sw b{display:block;height:48px}
.sw span{display:block;padding:6px 8px}
.type-row{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--c-border)}
.type-row .tag{width:80px;color:var(--c-text-muted);font-size:var(--fs-xs)}

/* mobile */
.bottom-bar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:20;box-shadow:var(--sh-pop)}
  .menu-btn{display:inline-flex}
  .top{padding:0 var(--sp-3);gap:var(--sp-2)} .top .search{display:none}
  .top select.input{max-width:150px;font-size:var(--fs-sm);padding-inline-end:28px}
  .top .new-lbl{display:none} .top .btn.primary.sm{width:32px;padding:0}
  .paper{padding:16px;overflow-x:auto;font-size:12px} .paper .hd{flex-direction:column}
  .paper th,.paper td{padding:0 4px}
  .page{padding:var(--sp-4);padding-bottom:96px}
  .g4{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}
  .pos{grid-template-columns:1fr}
  .totals{width:100%}
  .bottom-bar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--c-surface);border-top:1px solid var(--c-border);height:64px;z-index:10}
  .bottom-bar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--c-text-muted);text-decoration:none}
  .bottom-bar a.on{color:var(--c-accent);font-weight:600}
  .steps .lbl{display:none}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr} }

/* ---- app-specific (on top of the design-system primitives) ---- */
[hidden]{display:none!important}
a{color:var(--c-accent)}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.page-head h1{flex:1;min-width:200px}
.crumb{color:var(--c-text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin-bottom:var(--sp-4);overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--c-text-muted);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--c-text);border-color:var(--c-accent);font-weight:600}
tbody tr.click{cursor:pointer}
td a.rowlink{color:inherit;text-decoration:none;font-weight:600}
.auth{min-height:100vh;display:grid;place-items:center;padding:var(--sp-5);background:var(--c-bg)}
.auth .card{width:min(440px,100%);padding:var(--sp-6)}
.auth .brand{color:var(--c-text);justify-content:center;margin-bottom:var(--sp-5)}
.auth form{display:grid;gap:var(--sp-4)}
.wide{width:100%}
.note{background:var(--c-info-soft);color:var(--c-info);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-xs);line-height:var(--lh-xs)}
.note.warn{background:var(--c-warning-soft);color:var(--c-warning)}
.note.bad{background:var(--c-danger-soft);color:var(--c-danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.form-grid .full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;margin-bottom:var(--sp-3)}
.drawer-bg{position:fixed;inset:0;background:rgba(43,36,28,.45);z-index:40;display:flex;justify-content:flex-end}
[dir=rtl] .drawer-bg{justify-content:flex-start}
.drawer{background:var(--c-surface);width:min(520px,100%);height:100%;overflow:auto;padding:var(--sp-5);box-shadow:var(--sh-pop);display:flex;flex-direction:column;gap:var(--sp-4)}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer footer{margin-top:auto;display:flex;gap:8px;justify-content:flex-end;padding-top:var(--sp-4);border-top:1px solid var(--c-border)}
.toasts{position:fixed;bottom:var(--sp-5);inset-inline-end:var(--sp-5);display:grid;gap:8px;z-index:60}
.loading-screen{min-height:60vh;display:grid;place-items:center;text-align:center;gap:12px}
.loading-screen .spin{width:32px;height:32px;margin:auto;color:var(--c-accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--c-text-muted)} .kv dd{margin:0}
.editor .input.num{text-align:right}
.editor select.input{padding-inline-end:28px}
.line-total{font-weight:600}
.amt-big{font-size:var(--fs-xl);font-weight:700}
.alloc td{height:48px}
.logo-prev{width:72px;height:72px;border:1px dashed var(--c-border-input);border-radius:var(--r-md);display:grid;place-items:center;overflow:hidden;background:var(--c-surface-2)}
.logo-prev img{max-width:100%;max-height:100%}
.tree-tbl td:first-child{padding-inline-start:calc(16px + var(--d,0)*22px)}
.tree-tbl tr.grp td{font-weight:700;background:var(--c-bg)}
.ok-line{display:flex;align-items:center;gap:8px}
.mode-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--c-warning-soft);color:var(--c-warning);font-weight:600}
/* print: only the invoice paper */
@media print{
  body{background:#fff}
  .side,.top,.bottom-bar,.no-print,.toasts{display:none!important}
  .shell{display:block}
  .page{padding:0;max-width:none}
  .paper{border:0;box-shadow:none;max-width:none;padding:0}
  @page{size:A4;margin:12mm}
}
@media (max-width:900px){
  .form-grid{grid-template-columns:1fr}
  .editor-lines table thead{display:none}
  .editor-lines table, .editor-lines tbody, .editor-lines tr, .editor-lines td{display:block;width:100%}
  .editor-lines tr{border-bottom:1px solid var(--c-border);padding:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .editor-lines td{border:0;height:auto;padding:0 4px}
  .editor-lines td.c-item,.editor-lines td.c-desc{grid-column:1/-1}
  .editor-lines td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--c-text-muted)}
  .toasts{inset-inline:var(--sp-3);bottom:76px}
  .list-tbl thead{display:none}
  .list-tbl tr{display:grid;grid-template-columns:1fr auto;padding:10px 12px;border-bottom:1px solid var(--c-border);gap:2px 8px}
  .list-tbl td{height:auto;border:0;padding:0}
  .list-tbl td.m-hide{display:none}
  .list-tbl td.m-sub{color:var(--c-text-muted);font-size:var(--fs-xs)}
  .list-tbl tfoot{display:block} .list-tbl tfoot tr{display:flex;justify-content:space-between}

  const hash = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('daftar:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
  const me = () => { if (!S.session) throw new AppError('سجّل الدخول أولاً'); return S.session; };
  const org = () => { const m = S.members.find(m => m.user_id === me()); return m ? S.orgs.find(o => o.id === m.org_id) : null; };
  const O = () => { const o = org(); if (!o) throw new AppError('لا توجد شركة'); return o; };
  const acct = k => { const a = S.accounts.find(a => a.org_id === O().id && a.system_key === k); if (!a) throw new AppError('حساب النظام غير موجود: ' + k); return a.id; };
  const next = s => { const k = O().id + ':' + s; S.counters[k] = (S.counters[k] || 0) + 1; return S.counters[k]; };
  const mine = list => list.filter(r => r.org_id === O().id);

  function postEntry(date, memo, source_type, source_id, lines) {
    const d = lines.reduce((a, l) => a + (l.debit || 0), 0), c = lines.reduce((a, l) => a + (l.credit || 0), 0);
    if (d !== c || d === 0) throw new AppError(`القيد غير متوازن (مدين ${d} — دائن ${c})`);
    const e = { id: uid(), org_id: O().id, number: next('je'), entry_date: date, memo, source_type, source_id, status: 'posted', created_at: new Date().toISOString() };
    S.entries.push(e);
    lines.filter(l => (l.debit || 0) + (l.credit || 0) > 0).forEach(l => S.jlines.push({ id: uid(), entry_id: e.id, org_id: e.org_id, account_id: l.account_id, party_id: l.party_id || null, cost_center_id: null, debit: l.debit || 0, credit: l.credit || 0 }));
    return e.id;
  }

  return {
    mode: 'local',
    async session() { return S.session ? { user: S.users.find(u => u.id === S.session) } : null; },
    async signUp(email, pw) {
      email = email.trim().toLowerCase(); if (pw.length < 8) throw new AppError('كلمة المرور 8 أحرف على الأقل');
      if (S.users.some(u => u.email === email)) throw new AppError('هذا البريد مسجّل — سجّل الدخول');
      const u = { id: uid(), email, pw: await hash(pw) }; S.users.push(u); S.session = u.id; save(); return u;
    },
    async signIn(email, pw) {
      const u = S.users.find(u => u.email === email.trim().toLowerCase());
      if (!u || u.pw !== await hash(pw)) throw new AppError('البريد أو كلمة المرور غير صحيحة'); S.session = u.id; save(); return u;
    },
    async signOut() { S.session = null; save(); },
    async currentOrg() { return org(); },
    async createOrg(f) {
      if (f.vat_number && !VAT_RE.test(f.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      return tx(() => {
        const o = { id: uid(), name_ar: f.name_ar, vat_number: f.vat_number || null, cr_number: f.cr_number || null, city: f.city, district: f.district, street: f.street,
          building_no: f.building_no, postal_code: f.postal_code, sector: f.sector || 'general', logo_path: null, invoice_footer: '', plan: 'trial',
          trial_ends_at: new Date(Date.now() + 14 * 864e5).toISOString(), created_at: new Date().toISOString() };
        S.orgs.push(o); S.members.push({ org_id: o.id, user_id: me(), role: 'owner' });
        const ids = {}; CHART.forEach(([code, parent, ar, en, type, postable, key]) => { ids[code] = uid(); });
        CHART.forEach(([code, parent, ar, en, type, postable, key]) => S.accounts.push({ id: ids[code], org_id: o.id, parent_id: parent ? ids[parent] : null, code, name_ar: ar, name_en: en, type, is_postable: postable, system_key: key }));
        return o;
      });
    },
    async updateOrg(f) {
      if (f.vat_number && !VAT_RE.test(f.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      return tx(() => Object.assign(O(), f));
    },
    async listAccounts() { return mine(S.accounts).sort((a, b) => a.code.localeCompare(b.code)); },
    async trialBalance() {
      const accs = mine(S.accounts), by = {};
      mine(S.jlines).forEach(l => { const r = by[l.account_id] ||= { debit: 0, credit: 0 }; r.debit += l.debit; r.credit += l.credit; });
      return accs.filter(a => by[a.id]).map(a => ({ account_id: a.id, code: a.code, name_ar: a.name_ar, type: a.type, ...by[a.id], balance: by[a.id].debit - by[a.id].credit }))
        .sort((a, b) => a.code.localeCompare(b.code));
    },
    async listParties(kind) { return mine(S.parties).filter(p => !kind || p.kind === kind || p.kind === 'both').sort((a, b) => a.name.localeCompare(b.name, 'ar')); },
    async saveParty(p) {
      if (!p.name?.trim()) throw new AppError('الاسم مطلوب');
      if (p.vat_number && !VAT_RE.test(p.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      return tx(() => { if (p.id) { const r = S.parties.find(x => x.id === p.id && x.org_id === O().id); Object.assign(r, p); return r; }
        const r = { id: uid(), org_id: O().id, kind: 'customer', country: 'SA', is_active: true, created_at: new Date().toISOString(), ...p }; S.parties.push(r); return r; });
    },
    async listItems() {
      const items = mine(S.items), q = {}; mine(S.stock).forEach(m => q[m.item_id] = (q[m.item_id] || 0) + m.qty);
      return items.map(i => ({ ...i, on_hand: q[i.id] || 0 })).sort((a, b) => a.name_ar.localeCompare(b.name_ar, 'ar'));
    },
    async saveItem(i) {
      if (!i.name_ar?.trim()) throw new AppError('اسم الصنف مطلوب');
      if (['Z', 'E'].includes(i.tax_category) && !i.exemption_reason) throw new AppError('سبب الإعفاء أو النسبة الصفرية مطلوب');
      return tx(() => {
        const dup = mine(S.items).find(x => x.id !== i.id && ((i.sku && x.sku === i.sku) || (i.barcode && x.barcode === i.barcode)));
        if (dup) throw new AppError('رمز الصنف أو الباركود مستخدم لصنف آخر');
        if (i.id) { const r = S.items.find(x => x.id === i.id && x.org_id === O().id); Object.assign(r, i); return r; }
        const r = { id: uid(), org_id: O().id, is_active: true, created_at: new Date().toISOString(), ...i }; S.items.push(r); return r;
      });
    },
    async listDocuments(kinds) {
      const parties = Object.fromEntries(mine(S.parties).map(p => [p.id, p]));
      return mine(S.documents).filter(d => !kinds || kinds.includes(d.kind)).map(d => ({ ...d, party_name: parties[d.party_id]?.name || 'عميل نقدي' }))
        .sort((a, b) => (b.issue_date + b.created_at).localeCompare(a.issue_date + a.created_at));
    },
    async getDocument(id) {
      const d = mine(S.documents).find(d => d.id === id); if (!d) throw new AppError('المستند غير موجود');
      const lines = S.lines.filter(l => l.document_id === id).sort((a, b) => a.line_no - b.line_no);
      const party = S.parties.find(p => p.id === d.party_id) || null;
      const entry = S.entries.find(e => e.source_type === 'document' && e.source_id === id);
      const accs = Object.fromEntries(mine(S.accounts).map(a => [a.id, a]));
      const jl = entry ? S.jlines.filter(l => l.entry_id === entry.id).map(l => ({ ...l, code: accs[l.account_id].code, name_ar: accs[l.account_id].name_ar })) : [];
      const pays = S.allocs.filter(a => a.document_id === id).map(a => ({ ...a, payment: S.payments.find(p => p.id === a.payment_id) }));
      return { ...d, lines, party, entry, journal: jl, payments: pays };
    },
    async saveDraft(doc, lines) {
      return tx(() => {
        let d;
        if (doc.id) { d = mine(S.documents).find(x => x.id === doc.id); if (d.status !== 'draft') throw new AppError('لا يمكن تعديل مستند مرحّل — أصدر إشعاراً دائناً');
          Object.assign(d, doc); S.lines = S.lines.filter(l => l.document_id !== d.id); }
        else { d = { id: uid(), org_id: O().id, status: 'draft', payment_status: 'unpaid', amount_paid: 0, zatca_uuid: uid(), zatca_status: 'not_sent', currency: 'SAR', created_at: new Date().toISOString(), ...doc }; S.documents.push(d); }
        lines.forEach((l, i) => S.lines.push({ id: uid(), document_id: d.id, org_id: d.org_id, line_no: i + 1, ...l }));
        return d.id;
      });
    },
    async postSalesInvoice(id) {
      return tx(() => {
        const d = mine(S.documents).find(x => x.id === id);
        if (!d || d.status !== 'draft') throw new AppError('المستند مرحّل مسبقاً');
        const party = S.parties.find(p => p.id === d.party_id);
        if (d.kind === 'tax_invoice' && !party?.vat_number) throw new AppError('الفاتورة الضريبية تحتاج رقم ضريبي للعميل');
        const lines = S.lines.filter(l => l.document_id === id);
        if (!lines.length) throw new AppError('أضف سطراً واحداً على الأقل');
        let sub = 0, vat = 0; lines.forEach(l => { const c = lineCalc(l); l.line_net = c.net; l.line_vat = c.vat; sub += c.net; vat += c.vat; });
        if (sub <= 0) throw new AppError('إجمالي الفاتورة يجب أن يكون أكبر من صفر');
        Object.assign(d, { subtotal: sub, vat_total: vat, total: sub + vat });
        const rev = {}; lines.forEach(l => { const it = S.items.find(i => i.id === l.item_id); const a = it?.revenue_account_id || acct(it?.kind === 'service' ? 'service_revenue' : 'sales'); rev[a] = (rev[a] || 0) + l.line_net; });
        const jl = [{ account_id: acct('ar'), party_id: d.party_id, debit: d.total }, ...Object.entries(rev).map(([a, v]) => ({ account_id: a, credit: v }))];
        if (vat > 0) jl.push({ account_id: acct('vat_out'), credit: vat });
        let cogs = 0;
        lines.forEach(l => { const it = S.items.find(i => i.id === l.item_id); if (!it || !it.track_stock) return; l.unit_cost = it.avg_cost || 0;
          S.stock.push({ id: uid(), org_id: d.org_id, item_id: it.id, qty: -Number(l.qty), unit_cost: l.unit_cost, source_type: 'sale', source_id: d.id, move_date: d.issue_date }); cogs += Number(l.qty) * l.unit_cost; });
        cogs = Math.round(cogs); if (cogs > 0) jl.push({ account_id: acct('cogs'), debit: cogs }, { account_id: acct('inventory'), credit: cogs });
        postEntry(d.issue_date, 'فاتورة مبيعات', 'document', d.id, jl);
        const n = next('inv'); Object.assign(d, { status: 'posted', number: 'INV-' + String(n).padStart(5, '0'), posted_at: new Date().toISOString(), zatca_status: 'pending', zatca_icv: n });
        return d.id;
      });
    },
    async deleteDraft(id) { return tx(() => { const d = mine(S.documents).find(x => x.id === id); if (d?.status !== 'draft') throw new AppError('لا يمكن حذف مستند مرحّل');
      S.documents = S.documents.filter(x => x.id !== id); S.lines = S.lines.filter(l => l.document_id !== id); }); },
    async listPayments() { const parties = Object.fromEntries(mine(S.parties).map(p => [p.id, p]));
      return mine(S.payments).map(p => ({ ...p, party_name: parties[p.party_id]?.name || '—' })).sort((a, b) => (b.pay_date + b.created_at).localeCompare(a.pay_date + a.created_at)); },
    async createReceipt(r) {
      return tx(() => {
        const amount = Number(r.amount); if (!(amount > 0)) throw new AppError('أدخل مبلغاً صحيحاً');
        const allocated = (r.allocations || []).reduce((a, x) => a + x.amount, 0);
        if (allocated > amount) throw new AppError('المبالغ الموزعة أكبر من مبلغ السند');
        (r.allocations || []).forEach(x => { const d = mine(S.documents).find(d => d.id === x.document_id); if (!d || d.status !== 'posted') throw new AppError('فاتورة غير صالحة');
          if (x.amount > d.total - d.amount_paid) throw new AppError(`المبلغ يتجاوز المتبقي على ${d.number}`); });
        const p = { id: uid(), org_id: O().id, kind: 'receipt', party_id: r.party_id, pay_date: r.pay_date, amount, method: r.method, reference: r.reference || '',
          cash_account_id: acct(r.method === 'cash' ? 'cash' : r.method === 'card' ? 'card_clearing' : 'bank'), status: 'posted', created_at: new Date().toISOString() };
        S.payments.push(p);
        postEntry(p.pay_date, 'سند قبض', 'payment', p.id, [{ account_id: p.cash_account_id, debit: amount }, { account_id: acct('ar'), party_id: p.party_id, credit: amount }]);
        (r.allocations || []).forEach(x => { S.allocs.push({ payment_id: p.id, document_id: x.document_id, amount: x.amount });
          const d = mine(S.documents).find(d => d.id === x.document_id); d.amount_paid += x.amount; d.payment_status = d.amount_paid >= d.total ? 'paid' : 'partial'; });
        p.number = 'RV-' + String(next('rv')).padStart(5, '0');
        return p.id;
      });
    },
    async partyStatement(partyId) {
      const rows = [];
      mine(S.documents).filter(d => d.party_id === partyId && d.status === 'posted').forEach(d => rows.push({ date: d.issue_date, ref: d.number, what: 'فاتورة', debit: d.total, credit: 0, link: '#/invoices/' + d.id }));
      mine(S.payments).filter(p => p.party_id === partyId).forEach(p => rows.push({ date: p.pay_date, ref: p.number, what: 'سند قبض', debit: 0, credit: p.amount }));
      rows.sort((a, b) => a.date.localeCompare(b.date)); let bal = 0; rows.forEach(r => { bal += r.debit - r.credit; r.balance = bal; }); return rows;
    },
    // dev helpers
    async resetAll() { S = blank(); save(); },
  };
})();

const arErr = e => { const msg = String(e?.message || e || ''); for (const [re, t] of AR_ERRORS) { const m = msg.match(re); if (m) return typeof t === 'function' ? t(m) : t; }
  return msg ? 'تعذّر إتمام العملية: ' + msg : 'حدث خطأ غير متوقع'; };
const appUrl = () => location.origin + location.pathname;   // where Supabase sends users back (no #route)

const SupabaseAPI = (cfg) => {
  const sb = window.supabase.createClient(cfg.url, cfg.key, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit', storageKey: 'daftar-auth' } });
  let orgCache = null;
  const ok = ({ data, error }) => { if (error) throw new AppError(arErr(error)); return data; };
  const orgId = async () => (orgCache ||= await loadOrg())?.id;
  let accepted = null;   // user id we already accepted invitations for
  async function loadOrg() { const { data: { session } } = await sb.auth.getSession(); const u = session?.user; if (!u) return null;
    const mine = async () => ok(await sb.from('members').select('org_id,role').eq('user_id', u.id).order('created_at').limit(1));
    if (accepted !== u.id) { ok(await sb.rpc('accept_invitations')); accepted = u.id; }    // joins any company that invited this email
    let m = await mine(); if (!m.length) { ok(await sb.rpc('accept_invitations')); m = await mine(); } if (!m.length) return null;
    return { ...ok(await sb.from('orgs').select('*').eq('id', m[0].org_id).single()), my_role: m[0].role }; }
  const acctId = async k => ok(await sb.from('accounts').select('id').eq('org_id', await orgId()).eq('system_key', k).single()).id;
  const nulls = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, v === '' ? null : v]));
  return {
    mode: 'supabase', client: sb,
    async session() { return (await sb.auth.getSession()).data.session; },
    onAuth(cb) { sb.auth.onAuthStateChange((event, session) => cb(event, session)); },
    async signUp(email, pw) {
      if (pw.length < 8) throw new AppError('كلمة المرور 8 أحرف على الأقل');
      const r = ok(await sb.auth.signUp({ email: email.trim(), password: pw, options: { emailRedirectTo: appUrl() } }));
      // with "Confirm email" on, Supabase returns no session; an existing address comes back with no identities
      if (r.user && Array.isArray(r.user.identities) && r.user.identities.length === 0) throw new AppError('هذا البريد مسجّل — سجّل الدخول');
      return { user: r.user, needsConfirm: !r.session };
    },
    async signIn(email, pw) { orgCache = null; return ok(await sb.auth.signInWithPassword({ email: email.trim(), password: pw })).user; },
    async magicLink(email) { ok(await sb.auth.signInWithOtp({ email: email.trim(), options: { emailRedirectTo: appUrl(), shouldCreateUser: true } })); },
    async resetPassword(email) { ok(await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: appUrl() })); },
    async updatePassword(pw) { if (pw.length < 8) throw new AppError('كلمة المرور 8 أحرف على الأقل'); ok(await sb.auth.updateUser({ password: pw })); },
    async resendConfirm(email) { ok(await sb.auth.resend({ type: 'signup', email: email.trim(), options: { emailRedirectTo: appUrl() } })); },
    async signInWithGoogle() { ok(await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: appUrl(), queryParams: { prompt: 'select_account' } } })); },
    async signOut() { orgCache = null; await sb.auth.signOut(); },
    async currentOrg() { return orgCache = await loadOrg(); },
    async createOrg(f) {
      if (f.vat_number && !VAT_RE.test(f.vat_number)) throw new AppError('الرقم الضريبي 15 خانة ويبدأ وينتهي بالرقم 3');
      const id = ok(await sb.rpc('create_org', { p_name: f.name_ar, p_vat: f.vat_number || null, p_cr: f.cr_number || null, p_city: f.city || null, p_street: f.street || null,

  $('#app').innerHTML = authCard(isUp ? 'ابدأ تجربتك المجانية' : 'تسجيل الدخول', isUp ? '14 يوماً بلا بطاقة دفع. حساباتك تُرتَّب تلقائياً مع كل فاتورة.' : 'أهلاً بعودتك.', `
    ${server ? `<button type="button" class="btn secondary lg wide" id="google">${G_LOGO}<span>المتابعة بحساب Google</span></button>
      <div class="or"><span>أو بالبريد الإلكتروني</span></div>` : ''}
    <form id="authf" novalidate>
      ${field('email', 'البريد الإلكتروني', { type: 'email', req: true, attrs: 'autocomplete="email" dir="ltr"' })}
      ${field('pw', 'كلمة المرور', { type: 'password', req: true, help: isUp ? '8 أحرف على الأقل' : '', attrs: `autocomplete="${isUp ? 'new-password' : 'current-password'}" dir="ltr"` })}
      ${!isUp && server ? '<p style="margin:-8px 0 0;text-align:start"><a href="#/forgot">نسيت كلمة المرور؟</a></p>' : ''}
      <p class="help err" id="aerr" role="alert"></p>
      <button class="btn primary lg wide" type="submit">${isUp ? 'إنشاء الحساب' : 'دخول'}</button>
      ${!isUp && server ? '<button type="button" class="btn ghost wide" id="magic">أرسل لي رابط دخول بدون كلمة مرور</button>' : ''}
      <p style="text-align:center;margin:0">${isUp ? 'لديك حساب؟ <a href="#/login">سجّل الدخول</a>' : 'جديد هنا؟ <a href="#/signup">أنشئ حساباً</a>'}</p>
      ${api.mode === 'local' ? `<p class="note${serverDown ? ' bad' : ''}">${serverDown ? 'تعذّر الوصول للخادم — هذه نسخة تجريبية على هذا المتصفح فقط.' : 'وضع التجربة: الحساب والبيانات محفوظة في هذا المتصفح فقط. للربط بالخادم: ضع بيانات Supabase في الملف أو في الإعدادات.'}</p>` : ''}
    </form>`);
  authNotice = null;
  const err = $('#aerr');
  if ($('#google')) $('#google').onclick = async e => { err.textContent = ''; busy(e.currentTarget, true); try { await api.signInWithGoogle(); } catch (x) { err.textContent = x.message; busy(e.currentTarget, false); } };
  if ($('#magic')) $('#magic').onclick = async e => { const email = $('#f-email').value.trim(); err.textContent = '';
    if (!emailOk(email)) { err.textContent = 'اكتب بريدك الإلكتروني أولاً ثم اضغط الزر'; $('#f-email').focus(); return; }
    busy(e.target, true); try { await api.magicLink(email); sentView(email, 'magic'); } catch (x) { err.textContent = x.message; busy(e.target, false); } };
  $('#authf').addEventListener('submit', async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); err.textContent = '';
    if (!emailOk(f.email)) return err.textContent = 'أدخل بريداً إلكترونياً صحيحاً';
    if (!f.pw) return err.textContent = 'أدخل كلمة المرور';
    const btn = $('[type=submit]', e.target); busy(btn, true);
    try {
      if (isUp) { const r = await api.signUp(f.email, f.pw); if (r?.needsConfirm) return sentView(f.email.trim(), 'confirm'); }
      else await api.signIn(f.email, f.pw);
      location.hash = '#/dashboard'; route();
    } catch (x) { err.textContent = x.message; busy(btn, false); }
  });
}

    <p style="text-align:center;margin:0"><a href="#/login">العودة لتسجيل الدخول</a></p></form>`);
  $('#ff').addEventListener('submit', async e => { e.preventDefault(); const email = $('#f-email').value.trim(); if (!emailOk(email)) return $('#ferr').textContent = 'أدخل بريداً إلكترونياً صحيحاً';
    const btn = $('[type=submit]', e.target); busy(btn, true); try { await api.resetPassword(email); sentView(email, 'reset'); } catch (x) { $('#ferr').textContent = x.message; busy(btn, false); } });

function resetView() {
  $('#app').innerHTML = authCard('كلمة مرور جديدة', 'اختر كلمة مرور جديدة لحسابك.', `<form id="rf" novalidate>
    ${field('pw', 'كلمة المرور الجديدة', { type: 'password', req: true, help: '8 أحرف على الأقل', attrs: 'autocomplete="new-password" dir="ltr"' })}
    ${field('pw2', 'تأكيد كلمة المرور', { type: 'password', req: true, attrs: 'autocomplete="new-password" dir="ltr"' })}
    <p class="help err" id="rerr" role="alert"></p><button class="btn primary lg wide" type="submit">حفظ كلمة المرور</button></form>`);
  $('#rf').addEventListener('submit', async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), err = $('#rerr'); err.textContent = '';

    const btn = $('[type=submit]', e.target); busy(btn, true);

// ---------- users & permissions (owner / admin) ----------
const ROLES = { owner: 'المالك', admin: 'مدير', accountant: 'محاسب', accountant_readonly: 'محاسب — قراءة فقط', sales: 'مبيعات', cashier: 'كاشير', storekeeper: 'أمين مستودع', hr: 'موارد بشرية' };
const ROLE_HELP = { admin: 'كل شيء عدا إضافة المديرين', accountant: 'القيود والتقارير والفواتير', accountant_readonly: 'يرى كل شيء ولا يغيّر شيئاً — مناسب للمحاسب الخارجي', sales: 'الفواتير والعملاء وسندات القبض', cashier: 'نقاط البيع', storekeeper: 'المخزون والمشتريات', hr: 'الموظفون والرواتب' };
async function renderMembers() {
  const box = $('#members'); if (!box) return;
  const isOwner = ORG.my_role === 'owner';
  const roleOpts = Object.entries(ROLES).filter(([k]) => k !== 'owner' && (isOwner || k !== 'admin'));
  let members, invites;
  try { [members, invites] = await Promise.all([api.listMembers(), api.listInvites()]); } catch (x) { box.innerHTML = `<p class="note bad">${esc(x.message)}</p>`; return; }
  box.innerHTML = `<h2>المستخدمون والصلاحيات</h2>
    <p class="muted">لا يستطيع أحد الدخول للنظام إلا بدعوة. أضف بريد الشخص وصلاحيته، ثم أرسل له رابط النظام — يسجّل بنفس البريد أو بحساب Google ويدخل مباشرة.</p>
    <form id="invf2" class="form-grid" novalidate>
      ${field('email', 'البريد الإلكتروني', { type: 'email', req: true, attrs: 'dir="ltr" autocomplete="off"' })}
      ${select('role', 'الصلاحية', roleOpts, 'accountant')}
      <p class="help full" id="rhelp">${esc(ROLE_HELP.accountant)}</p>
      <label class="full row" style="gap:8px"><input type="checkbox" name="send" checked> أرسل له رابط دخول على بريده الآن</label>
      <p class="help err full" id="ierr" role="alert"></p>
      <div class="full row"><button class="btn primary" type="submit">${icon('plus')} إضافة مستخدم</button></div></form>
    ${invites.length ? `<h3 style="margin-top:24px">دعوات بانتظار التسجيل</h3><div class="tbl-wrap"><table><thead><tr><th>البريد</th><th>الصلاحية</th><th>التاريخ</th><th></th></tr></thead><tbody>
      ${invites.map(i => `<tr><td dir="ltr" style="text-align:start">${esc(i.email)}</td><td>${esc(ROLES[i.role])}</td><td class="num">${esc(i.created_at.slice(0, 10))}</td>
        <td style="text-align:end"><button class="btn ghost sm" data-resend="${esc(i.email)}">إعادة إرسال الرابط</button><button class="btn ghost sm" data-revoke="${esc(i.id)}" style="color:var(--c-danger)">إلغاء</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    <h3 style="margin-top:24px">أعضاء الشركة (${members.length})</h3><div class="tbl-wrap"><table><thead><tr><th>البريد</th><th>الصلاحية</th><th>منذ</th><th></th></tr></thead><tbody>
      ${members.map(m => { const locked = m.role === 'owner' || m.is_me || (!isOwner && m.role === 'admin');
        return `<tr><td dir="ltr" style="text-align:start">${esc(m.email)}${m.is_me ? ' <span class="badge b-info">أنت</span>' : ''}</td>
        <td>${locked ? esc(ROLES[m.role]) : `<select class="input" data-role="${esc(m.user_id)}" aria-label="صلاحية ${esc(m.email)}" style="height:34px">${roleOpts.map(([k, t]) => `<option value="${k}"${k === m.role ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`}</td>
        <td class="num">${esc(String(m.joined_at).slice(0, 10))}</td>
        <td style="text-align:end">${locked ? '' : `<button class="btn ghost sm" data-remove="${esc(m.user_id)}" style="color:var(--c-danger)">إزالة</button>`}</td></tr>`; }).join('')}</tbody></table></div>`;
  $('#f-role', box).onchange = e => $('#rhelp').textContent = ROLE_HELP[e.target.value] || '';
  $('#invf2').addEventListener('submit', async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const err = $('#ierr'); err.textContent = '';
    const btn = $('[type=submit]', e.target); busy(btn, true);
    try { await api.invite(f.email, f.role); let sent = false;
      if (f.send) { try { await api.sendInviteLink(f.email.trim().toLowerCase()); sent = true; } catch (x) { toast('أُضيفت الدعوة لكن تعذّر إرسال البريد: ' + x.message, 'warn'); } }
      toast(sent ? 'أُضيف المستخدم وأُرسل له رابط الدخول' : 'أُضيف المستخدم — أرسل له رابط النظام ليسجّل'); renderMembers(); }
    catch (x) { err.textContent = x.message; busy(btn, false); } });
  if (box.dataset.wired) return; box.dataset.wired = 1;
  box.addEventListener('click', async e => { const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.revoke) { await api.revokeInvite(b.dataset.revoke); toast('أُلغيت الدعوة'); renderMembers(); }
      if (b.dataset.resend) { busy(b, true); await api.sendInviteLink(b.dataset.resend); toast('أُرسل رابط الدخول'); busy(b, false); }
      if (b.dataset.remove) { if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'تأكيد الإزالة؟'; return; } await api.removeMember(b.dataset.remove); toast('أُزيل المستخدم ولن يستطيع الدخول للشركة'); renderMembers(); }
    } catch (x) { toast(x.message, 'bad'); busy(b, false); } });
  box.addEventListener('change', async e => { const s = e.target.closest('[data-role]'); if (!s) return;
    try { await api.setRole(s.dataset.role, s.value); toast('تم تغيير الصلاحية'); } catch (x) { toast(x.message, 'bad'); renderMembers(); } });
}

// ---------- dashboard ----------
async function dashboardView() {
  shell('dashboard', loading());
  const [docs, tb] = await Promise.all([api.listDocuments(['tax_invoice', 'simplified_invoice']), api.trialBalance()]);
  const month = riyadhToday().slice(0, 7), posted = docs.filter(d => d.status === 'posted');
  const mDocs = posted.filter(d => d.issue_date.startsWith(month));
  const sales = mDocs.reduce((a, d) => a + d.subtotal, 0), vat = mDocs.reduce((a, d) => a + d.vat_total, 0);
  const open = posted.reduce((a, d) => a + (d.total - d.amount_paid), 0), overdue = posted.filter(d => d.due_date && d.due_date < riyadhToday() && d.payment_status !== 'paid');
  const cash = tb.filter(r => ['1101', '1102', '1103'].includes(r.code)).reduce((a, r) => a + Number(r.balance), 0);
  $('#main').innerHTML = `<div class="page-head"><h1>لوحة التحكم</h1><a class="btn secondary" href="#/receipts/new">${icon('receipt')}سند قبض</a><a class="btn primary" href="#/invoices/new">${icon('plus')}فاتورة جديدة</a></div>
    <div class="grid g4" style="margin-bottom:24px">
      <div class="card stat"><div class="label">مبيعات هذا الشهر <span class="xs">(قبل الضريبة)</span></div><div class="val num">${money(sales)}</div><div class="xs muted">${mDocs.length} فاتورة</div></div>
      <div class="card stat"><div class="label">ضريبة المخرجات هذا الشهر</div><div class="val num">${money(vat)}</div><div class="xs muted">تُورَّد في الإقرار الضريبي</div></div>
      <div class="card stat"><div class="label">مستحق من العملاء</div><div class="val num">${money(open)}</div><div class="xs ${overdue.length ? 'down' : 'muted'}">${overdue.length ? overdue.length + ' فاتورة متأخرة' : 'لا يوجد متأخر'}</div></div>
      <div class="card stat"><div class="label">النقدية والبنك</div><div class="val num">${money(cash)}</div><div class="xs muted">الصندوق + البنك + الشبكة</div></div>
    </div>
    <h2 style="margin-bottom:12px">آخر الفواتير</h2>

async function invoicesView() {
  shell('invoices', loading());
  const docs = await api.listDocuments(['tax_invoice', 'simplified_invoice']);
  let tab = sessionStorage.getItem('inv-tab') || 'all';
  const render = () => {
    const f = { all: docs, draft: docs.filter(d => d.status === 'draft'), unpaid: docs.filter(d => d.status === 'posted' && d.payment_status !== 'paid'), paid: docs.filter(d => d.payment_status === 'paid') }[tab];
    const tot = f.filter(d => d.status === 'posted').reduce((a, d) => a + d.total, 0);
    $('#main').innerHTML = `<div class="page-head"><h1>الفواتير</h1><a class="btn primary" href="#/invoices/new">${icon('plus')}فاتورة جديدة</a></div>
      <div class="tabs" role="tablist">${[['all', 'الكل'], ['unpaid', 'غير مدفوعة'], ['paid', 'مدفوعة'], ['draft', 'مسودات']].map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-tab="${k}">${t} <span class="muted num">(${({ all: docs, draft: docs.filter(d => d.status === 'draft'), unpaid: docs.filter(d => d.status === 'posted' && d.payment_status !== 'paid'), paid: docs.filter(d => d.payment_status === 'paid') })[k].length})</span></button>`).join('')}</div>
      ${f.length ? invoiceTable(f) + `<p class="muted" style="text-align:end">الإجمالي المرحّل: <b class="num">${money(tot)}</b> ر.س</p>` : empty('file', docs.length ? 'لا شيء هنا' : 'لا توجد فواتير بعد', docs.length ? 'جرّب تبويباً آخر.' : 'أصدر أول فاتورة لعميلك.', docs.length ? '' : `<a class="btn primary" href="#/invoices/new">${icon('plus')}فاتورة جديدة</a>`)}`;
    $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; sessionStorage.setItem('inv-tab', tab); render(); });
  };
  render();
}

async function invoiceEditView(id) {
  shell('invoices', loading());
  const [parties, items, existing] = await Promise.all([api.listParties('customer'), api.listItems(), id ? api.getDocument(id) : null]);
  if (existing && existing.status !== 'draft') { location.hash = '#/invoices/' + id; return; }
  const doc = existing || { kind: 'tax_invoice', party_id: '', issue_date: riyadhToday(), due_date: '', note: '' };
  let lines = existing ? existing.lines.map(l => ({ item_id: l.item_id || '', description: l.description, qty: Number(l.qty), unit_price: l.unit_price, discount: l.discount || 0, tax_category: l.tax_category, vat_rate: Number(l.vat_rate) }))

function itemDrawer(it, after) {
  it = it || { kind: 'product', tax_category: 'S', track_stock: true, unit: 'حبة' };
  const f = drawer(it.id ? 'تعديل صنف' : 'صنف أو خدمة جديدة', `

    ${field('unit', 'الوحدة', { value: it.unit, help: 'حبة، متر، طن، ساعة…' })}${field('sale_price', 'سعر البيع قبل الضريبة', { type: 'money', value: it.sale_price != null ? money(it.sale_price) : '', req: true })}</div>

    <div id="exw" ${['Z', 'E'].includes(it.tax_category) ? '' : 'hidden'}>${field('exemption_reason', 'سبب الإعفاء / النسبة الصفرية', { value: it.exemption_reason, help: 'يُطلب من زاتكا، مثل: تصدير سلع خارج المملكة' })}</div>
    <div id="cw" ${it.kind === 'service' ? 'hidden' : ''}>${field('avg_cost', 'تكلفة الوحدة', { type: 'money', value: it.avg_cost ? money(it.avg_cost) : '', help: 'تُستخدم لحساب تكلفة المبيعات. ستُحدَّث تلقائياً من فواتير الشراء لاحقاً.' })}</div>`,
    async v => { const price = toHalalas(v.sale_price); if (!Number.isFinite(price) || price < 0 || v.sale_price === '') throw new AppError('سعر البيع غير صحيح');
      const cost = v.avg_cost ? toHalalas(v.avg_cost) : 0; if (!Number.isFinite(cost) || cost < 0) throw new AppError('التكلفة غير صحيحة');
      const r = await api.saveItem({ ...(it.id ? { id: it.id } : {}), kind: v.kind, name_ar: v.name_ar.trim(), sku: v.sku || null, barcode: toLatin(v.barcode) || null, unit: v.unit || 'حبة',
        sale_price: price, tax_category: v.tax_category, vat_rate: v.tax_category === 'S' ? 15 : 0, exemption_reason: v.exemption_reason || null, track_stock: v.kind === 'product', avg_cost: v.kind === 'product' ? cost : 0 });
      await after?.(r); });
  $('#f-tax_category', f).addEventListener('change', e => $('#exw', f).hidden = !['Z', 'E'].includes(e.target.value));
  $('#f-kind', f).addEventListener('change', e => $('#cw', f).hidden = e.target.value === 'service');
}

async function receiptNewView(qs) {
  shell('receipts', loading());
  const [ps, docs] = await Promise.all([api.listParties('customer'), api.listDocuments(['tax_invoice', 'simplified_invoice'])]);
  const openDocs = docs.filter(d => d.status === 'posted' && d.payment_status !== 'paid');
  let party = qs.get('party') || '', alloc = {};
  $('#main').innerHTML = `<a class="crumb" href="#/receipts">${icon('chev')} سندات القبض</a><div class="page-head"><h1>سند قبض جديد</h1></div>
    <form class="card" id="rf" novalidate style="max-width:var(--l-form-max)">
      <div class="form-grid"><div class="field"><label for="f-party">العميل</label><select class="input" id="f-party" name="party_id"><option value="">— عميل نقدي —</option>${ps.map(p => `<option value="${esc(p.id)}"${p.id === party ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      ${field('pay_date', 'التاريخ', { type: 'date', value: riyadhToday(), req: true })}
      ${field('amount', 'المبلغ المستلم', { type: 'money', req: true })}
      ${select('method', 'طريقة الاستلام', Object.entries(METHOD), 'bank_transfer')}
      ${field('reference', 'المرجع', { help: 'رقم الحوالة أو الإيصال (اختياري)', cls: 'full' })}</div>
      <h3 style="margin:20px 0 8px">توزيع المبلغ على الفواتير</h3><div id="allocs"></div>
      <p class="help err" id="rerr" role="alert"></p>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><a class="btn ghost" href="#/receipts">إلغاء</a><button class="btn primary" type="submit">حفظ وترحيل السند</button></div></form>`;
  const pre = qs.get('doc');
  const drawAlloc = () => {
    const mine = openDocs.filter(d => (d.party_id || '') === party);
    $('#allocs').innerHTML = mine.length ? `<div class="tbl-wrap"><table class="alloc"><thead><tr><th>الفاتورة</th><th>التاريخ</th><th class="amt">المتبقي</th><th style="width:160px">المبلغ المخصص</th></tr></thead><tbody>
      ${mine.map(d => `<tr><td class="num">${esc(d.number)}</td><td class="num">${esc(d.issue_date)}</td><td class="amt num">${money(d.total - d.amount_paid)}</td><td><input class="input num" data-doc="${esc(d.id)}" data-max="${d.total - d.amount_paid}" inputmode="decimal" value="${alloc[d.id] ? money(alloc[d.id]) : ''}" aria-label="المبلغ المخصص للفاتورة ${esc(d.number)}"></td></tr>`).join('')}</tbody></table></div>
      <p class="xs muted" id="asum" style="margin-top:6px"></p>` : `<p class="muted">${party ? 'لا توجد فواتير مفتوحة لهذا العميل — سيُسجَّل المبلغ دفعة على الحساب.' : 'اختر العميل لعرض فواتيره المفتوحة.'}</p>`;
    sumAlloc();
  };
  const sumAlloc = () => { const a = toHalalas($('#f-amount').value || 0), s = Object.values(alloc).reduce((x, y) => x + y, 0); const el = $('#asum');
    if (el) el.textContent = `الموزَّع ${money(s)} من ${money(Number.isFinite(a) ? a : 0)}${a > s ? ` — يبقى ${money(a - s)} دفعة على الحساب` : ''}`; };
  const autoAlloc = () => { alloc = {}; let a = toHalalas($('#f-amount').value || 0); if (!Number.isFinite(a)) a = 0;
    const mine = openDocs.filter(d => (d.party_id || '') === party).sort((x, y) => x.issue_date.localeCompare(y.issue_date));
    if (pre) mine.sort((x, y) => (y.id === pre) - (x.id === pre));
    mine.forEach(d => { const take = Math.min(a, d.total - d.amount_paid); if (take > 0) { alloc[d.id] = take; a -= take; } }); drawAlloc(); };
  $('#f-party').onchange = e => { party = e.target.value; autoAlloc(); };
  $('#f-amount').oninput = autoAlloc;
  $('#allocs').addEventListener('input', e => { const i = e.target.closest('[data-doc]'); if (!i) return; const v = toHalalas(i.value || 0); alloc[i.dataset.doc] = Number.isFinite(v) ? v : 0; sumAlloc(); });
  if (pre) { const d = openDocs.find(x => x.id === pre); if (d) { $('#f-amount').value = money(d.total - d.amount_paid); autoAlloc(); } } else drawAlloc();
  $('#rf').addEventListener('submit', async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), err = $('#rerr'); err.textContent = '';
    const amount = toHalalas(f.amount); if (!(amount > 0)) return err.textContent = 'أدخل المبلغ المستلم';
    const allocations = Object.entries(alloc).filter(([, v]) => v > 0).map(([document_id, amount]) => ({ document_id, amount }));
    for (const a of allocations) { const d = openDocs.find(x => x.id === a.document_id); if (a.amount > d.total - d.amount_paid) return err.textContent = `المبلغ المخصص يتجاوز المتبقي على ${d.number}`; }
    if (allocations.reduce((x, a) => x + a.amount, 0) > amount) return err.textContent = 'المبالغ الموزعة أكبر من المبلغ المستلم';
    if (!f.party_id && amount > allocations.reduce((x, a) => x + a.amount, 0)) return err.textContent = 'اختر العميل، أو خصّص المبلغ كاملاً على فواتير';
    $('[type=submit]', e.target).disabled = true;
    try { await api.createReceipt({ party_id: f.party_id || null, pay_date: f.pay_date, amount, method: f.method, reference: f.reference, allocations }); toast('تم ترحيل سند القبض');
      location.hash = pre ? '#/invoices/' + pre : '#/receipts'; } catch (x) { err.textContent = x.message; $('[type=submit]', e.target).disabled = false; } });
}

// ---------- accounts & trial balance ----------
async function accountsView() {
  shell('accounts', loading()); const [accs, tb] = await Promise.all([api.listAccounts(), api.trialBalance()]);
  const bal = Object.fromEntries(tb.map(r => [r.account_id, Number(r.balance)])), kids = {};
  accs.forEach(a => (kids[a.parent_id || 'root'] ||= []).push(a));
  const roll = a => (bal[a.id] || 0) + (kids[a.id] || []).reduce((s, k) => s + roll(k), 0);
  const sign = a => ['asset', 'expense'].includes(a.type) ? 1 : -1;
  const rows = []; const walk = (a, d) => { rows.push({ a, d }); (kids[a.id] || []).forEach(k => walk(k, d + 1)); }; (kids.root || []).forEach(a => walk(a, 0));
  $('#main').innerHTML = `<div class="page-head"><h1>شجرة الحسابات</h1><span class="muted">${accs.length} حساباً</span></div>
    <p class="muted" style="margin:-8px 0 16px">الحسابات التي عليها قفل يستخدمها النظام في القيود التلقائية ولا تُحذف.</p>
    <div class="tbl-wrap"><table class="tree-tbl"><thead><tr><th>الحساب</th><th>الرمز</th><th class="amt">الرصيد</th></tr></thead><tbody>
    ${rows.map(({ a, d }) => `<tr class="${a.is_postable ? '' : 'grp'}" style="--d:${d}"><td>${esc(a.name_ar)} ${a.system_key ? `<span class="muted" title="حساب نظام">${icon('lock')}</span>` : ''}</td><td class="num muted">${esc(a.code)}</td><td class="amt num">${roll(a) ? money(roll(a) * sign(a)) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

      ${api.mode === 'local' ? `<hr style="border:0;border-top:1px solid var(--c-border);margin:20px 0"><h3>بيانات تجريبية</h3><p class="muted">املأ النظام بعملاء وأصناف وفواتير لكرافت لاند لتجربته بسرعة.</p>
      <div class="row"><button class="btn secondary" id="demo">تعبئة بيانات تجريبية</button><button class="btn ghost" id="wipe" style="color:var(--c-danger)">مسح كل البيانات</button></div>` : ''}</section>
    ${api.mode === 'supabase' && ['owner', 'admin'].includes(ORG?.my_role) ? '<section class="card" id="members" style="max-width:var(--l-form-max);margin-top:24px">' + loading() + '</section>' : ''}`;
  renderMembers();
  let logo = o.logo_path;
  $('#logo').onchange = e => { const file = e.target.files[0]; if (!file) return; if (file.size > 300 * 1024) { toast('الملف أكبر من 300 كيلوبايت', 'bad'); e.target.value = ''; return; }
    const r = new FileReader(); r.onload = () => { logo = r.result; $('#lp').innerHTML = `<img src="${esc(logo)}" alt="الشعار الجديد">`; }; r.readAsDataURL(file); };
  if ($('#rmlogo')) $('#rmlogo').onclick = () => { logo = null; $('#lp').innerHTML = icon('box'); };
  $('#sf').addEventListener('submit', async e => { e.preventDefault(); $('#serr').textContent = '';
    try { const f = cleanCompany(Object.fromEntries(new FormData(e.target))); 
      ORG = await api.updateOrg({ ...f, logo_path: logo }); toast('تم حفظ الإعدادات'); settingsView(); } catch (x) { $('#serr').textContent = x.message; } });
  if ($('#bf')) $('#bf').addEventListener('submit', e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(f.url.trim()) || f.key.trim().length < 30) { toast('تحقق من العنوان والمفتاح', 'bad'); return; }
    localStorage.setItem('daftar-backend', JSON.stringify({ url: f.url.trim().replace(/\/$/, ''), key: f.key.trim() })); location.reload(); });
  if ($('#bclear')) $('#bclear').onclick = () => { localStorage.removeItem('daftar-backend'); location.reload(); };
  if ($('#demo')) $('#demo').onclick = async () => { try { await seedDemo(); toast('تمت تعبئة البيانات التجريبية'); location.hash = '#/dashboard'; } catch (x) { fail(x); } };
  if ($('#wipe')) $('#wipe').onclick = async () => { const b = $('#wipe'); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'متأكد؟ اضغط مرة أخرى — يُحذف كل شيء'; return; } await api.resetAll(); location.hash = '#/signup'; location.reload(); };
}
async function seedDemo() {
  const havePs = await api.listParties(), haveIs = await api.listItems();
  const party = async p => havePs.find(x => x.vat_number && x.vat_number === p.vat_number) || api.saveParty(p);
  const item = async i => haveIs.find(x => x.sku === i.sku) || api.saveItem(i);
  const c1 = await party({ name: 'مؤسسة الواحة للمقاولات', kind: 'customer', vat_number: '311111111111113', city: 'جدة', district: 'الصناعية', street: 'شارع الملك فهد', building_no: '4410', postal_code: '23511', phone: '0550000001' });
  const c2 = await party({ name: 'شركة الأفق للتعدين', kind: 'customer', vat_number: '322222222222223', city: 'الرياض', district: 'السلي', street: 'طريق الخرج', building_no: '7788', postal_code: '14322', phone: '0550000002' });
  const i1 = await item({ kind: 'product', name_ar: 'كرفان مكتبي 6×3 م', sku: 'CRV-6x3', unit: 'حبة', sale_price: 5000000, tax_category: 'S', vat_rate: 15, track_stock: true, avg_cost: 3200000 });
  const i2 = await item({ kind: 'product', name_ar: 'هنجر حديد 30×20 م', sku: 'HNG-30x20', unit: 'حبة', sale_price: 16000000, tax_category: 'S', vat_rate: 15, track_stock: true, avg_cost: 11000000 });
  const i3 = await item({ kind: 'service', name_ar: 'نقل وتركيب في الموقع', sku: 'SRV-INST', unit: 'خدمة', sale_price: 350000, tax_category: 'S', vat_rate: 15, track_stock: false, avg_cost: 0 });
  const L = (it, qty, disc = 0) => ({ item_id: it.id, description: it.name_ar, qty, unit_price: it.sale_price, discount: disc, tax_category: 'S', vat_rate: 15, line_net: 0, line_vat: 0 });
  const today = riyadhToday(), back = n => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh' }).format(new Date(Date.now() - n * 864e5));
  const d1 = await api.saveDraft({ kind: 'tax_invoice', party_id: c1.id, issue_date: back(12), issue_time: '10:15:00', due_date: back(2) }, [L(i1, 2), L(i3, 2)]); await api.postSalesInvoice(d1);
  const d2 = await api.saveDraft({ kind: 'tax_invoice', party_id: c2.id, issue_date: back(5), issue_time: '12:40:00', due_date: back(-25) }, [L(i2, 1, 500000), L(i3, 1)]); await api.postSalesInvoice(d2);
  const d3 = await api.saveDraft({ kind: 'simplified_invoice', party_id: null, issue_date: today, issue_time: riyadhTime() }, [L(i3, 1)]); await api.postSalesInvoice(d3);
  const doc1 = await api.getDocument(d1); await api.createReceipt({ party_id: c1.id, pay_date: back(3), amount: 6000000, method: 'bank_transfer', reference: 'TRX-88120', allocations: [{ document_id: d1, amount: 6000000 }] });
  const doc3 = await api.getDocument(d3); await api.createReceipt({ party_id: null, pay_date: today, amount: doc3.total, method: 'cash', allocations: [{ document_id: d3, amount: doc3.total }] });
  void doc1;
}

// ---------- router ----------
const stub = (key, title, what) => () => { shell(key, `<div class="page-head"><h1>${esc(title)}</h1></div>${empty('box', 'قيد البناء', what)}`); };
const ROUTES = [
  [/^#\/dashboard$/, dashboardView], [/^#\/invoices$/, invoicesView], [/^#\/invoices\/new$/, () => invoiceEditView(null)],
  [/^#\/invoices\/([\w-]+)\/edit$/, m => invoiceEditView(m[1])], [/^#\/invoices\/([\w-]+)$/, m => invoiceView(m[1])],
  [/^#\/customers$/, customersView], [/^#\/customers\/([\w-]+)$/, m => customerView(m[1])], [/^#\/items$/, itemsView],
  [/^#\/receipts$/, receiptsView], [/^#\/receipts\/new(\?.*)?$/, m => receiptNewView(new URLSearchParams((m[1] || '').slice(1)))],
  [/^#\/accounts$/, accountsView], [/^#\/trial-balance$/, trialBalanceView], [/^#\/settings$/, settingsView],
  [/^#\/purchases$/, stub('purchases', 'المشتريات', 'فواتير الموردين وتحديث متوسط التكلفة — المرحلة القادمة.')],
  [/^#\/expenses$/, stub('expenses', 'المصروفات', 'المصروفات والعُهد وربطها بالمشاريع — المرحلة القادمة.')],
  [/^#\/inventory$/, stub('inventory', 'المخزون', 'المستودعات والتحويلات والجرد — المرحلة القادمة.')],
  [/^#\/pos$/, stub('pos', 'نقاط البيع', 'الكاشير والورديات والعمل بدون إنترنت — المرحلة الثانية.')],
  [/^#\/reports$/, stub('reports', 'التقارير المالية', 'قائمة الدخل والمركز المالي والإقرار الضريبي — المرحلة القادمة.')],
  [/^#\/payroll$/, stub('payroll', 'الرواتب', 'الموظفون والرواتب والتأمينات ونهاية الخدمة — المرحلة الثالثة.')],
];
async function route() {
  const h = location.hash || '#/dashboard';
  try {
    const s = await api.session();
    if (!s) { recovering = false;
      if (h === '#/signup') return authView('signup'); if (h === '#/forgot' && api.mode === 'supabase') return forgotView();
      return authView(h === '#/login' ? 'login' : (LocalAPI.mode === api.mode && !localStorage.getItem('daftar-local-v1')?.includes('"email"') ? 'signup' : 'login')); }
    if (api.mode === 'supabase' && (recovering || h === '#/reset')) { if (location.hash !== '#/reset') { location.hash = '#/reset'; return; } return resetView(); }
    if (['#/login', '#/signup', '#/forgot'].includes(h)) { location.hash = '#/dashboard'; return; }
    if (!ORG) { $('#app').innerHTML = loading('جارٍ فتح حسابك…'); ORG = await api.currentOrg(); }
    if (!ORG) { if (api.mode === 'supabase' && !(await api.whoami()).is_platform_admin) return noCompanyView(s.user?.email); return onboardingView(); }
    const r = ROUTES.find(([re]) => re.test(h));
    if (!r) { location.hash = '#/dashboard'; return; }
    await r[1](h.match(r[0]));
    $('#side')?.classList.remove('open'); $('#main')?.focus({ preventScroll: true }); window.scrollTo(0, 0);
    document.title = ($('#main h1')?.textContent || 'دفتر') + ' — ' + (ORG?.name_ar || '');
  } catch (e) {
    fail(e);
    if ($('#main')) $('#main').innerHTML = `<div class="card empty">${icon('alert')}<h3 style="margin:12px 0 4px">تعذّر تحميل الصفحة</h3><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div>`;
    else $('#app').innerHTML = `<div class="auth"><div class="card empty">${icon('alert')}<h3>تعذّر فتح الحساب</h3><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div></div>`;
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('unhandledrejection', e => fail(e.reason));
pickBackend().then(route);
}
